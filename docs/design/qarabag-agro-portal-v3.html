<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qarabağ Aqrar İnvestisiya Portalı</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--pri:#0f3d6e;--pri2:#1b5ea3;--ok:#1f8a5b;--red:#c8323f;--bg:#f1f4f8;--sf:#fff;--ink:#16222e;--mu:#5a6877;--ln:#d9e0e8;--f1:#2f8f4e;--f2:#c9861a;--f3:#8a4f9e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
h1,h2,h3{margin:0 0 .5rem;line-height:1.2;font-weight:600}
.flag{height:5px;background:linear-gradient(90deg,#00b5e2 33%,#ef3340 33% 66%,#509e2f 66%)}
header{background:var(--pri);color:#fff;padding:.7rem 1.2rem;display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between}
.brand{display:flex;gap:.8rem;align-items:center}
.brand small{display:block;opacity:.75;font-size:.78rem}
.brand b{font-size:1.1rem}
.badge{background:#ffffff22;border:1px solid #ffffff55;border-radius:4px;padding:.05rem .5rem;font-size:.75rem;margin-left:.4rem}
nav{background:var(--sf);border-bottom:1px solid var(--ln);padding:0 1rem;display:flex;flex-wrap:wrap;gap:.2rem;overflow-x:auto}
nav button{border:0;background:none;padding:.8rem 1rem;cursor:pointer;border-bottom:3px solid transparent;font:inherit;color:var(--mu);white-space:nowrap}
nav button.on{color:var(--pri);border-color:var(--pri);font-weight:600}
button,select,input,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--ln);background:var(--sf);padding:.45rem .9rem;border-radius:6px;cursor:pointer}
.btn.pri{background:var(--pri2);color:#fff;border-color:var(--pri2)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.sm{padding:.2rem .6rem;font-size:.85rem}
select.rl{background:#ffffff18;color:#fff;border:1px solid #ffffff55;border-radius:6px;padding:.3rem}
select.rl option{color:#000}
:focus-visible{outline:3px solid #f2b134;outline-offset:2px}
main{max-width:1280px;margin:0 auto;padding:1rem}
.row{display:flex;gap:1rem;flex-wrap:wrap;align-items:flex-start}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:1rem}
.mapw{flex:3 1 520px;min-width:0;padding:0;overflow:hidden}
#lmap{height:68vh;min-height:420px}
.side{flex:1 1 300px;padding:0;overflow:hidden}
.side>div{padding:1rem}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin:.6rem 0}
.chip{border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:.25rem .9rem;cursor:pointer}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.mk{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 6px #0008;display:grid;place-items:center;font-size:14px}
.city{background:#0009;color:#fff;border:0;border-radius:3px;font-size:11px;padding:1px 5px}
.city:before{display:none}
.tag{display:inline-block;padding:.05rem .6rem;border-radius:99px;font-size:.8rem;color:#fff}
.md{display:inline-block;padding:.05rem .5rem;border:1px solid var(--pri2);color:var(--pri2);border-radius:4px;font-size:.8rem;margin-right:.25rem}
.s-Qəbul{background:#5a6877}.s-Baxılır{background:#1b5ea3}.s-Əlavə{background:#b8860b}.s-Qərar{background:#1f8a5b}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;overflow:hidden}
.card .hd{padding:.5rem 1rem;color:#fff;font-weight:600}
.cb{padding:1rem}
.acts{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:.5rem;border-bottom:1px solid var(--ln);vertical-align:top;font-size:.92rem}
th{color:var(--mu);font-weight:600}
.scroll{overflow-x:auto}
label{display:block;margin:.7rem 0 .2rem;font-weight:600;font-size:.9rem}
input,select,textarea{width:100%;padding:.5rem;border:1px solid var(--ln);border-radius:6px;background:#fff}
input[type=radio]{width:auto}
.fs{border:1px solid var(--ln);border-radius:8px;padding:.2rem 1rem 1rem;margin:1rem 0}
.fs legend{font-weight:600;color:var(--pri);padding:0 .4rem}
.pr{display:grid;grid-template-columns:2fr 1.2fr .7fr 1.3fr auto;gap:.4rem;margin-bottom:.4rem;align-items:center}
.tl{border-left:3px solid var(--ln);margin:.5rem 0 0 .4rem;padding-left:.8rem;font-size:.88rem;color:var(--mu)}
pre{background:#10171a;color:#cfe3d4;padding:.8rem;border-radius:8px;overflow-x:auto;font-size:.82rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:1.2rem;background:var(--ink);color:#fff;padding:.6rem 1rem;border-radius:8px;z-index:9999}
.mu{color:var(--mu)}
.bar{height:10px;background:var(--pri2);border-radius:5px;margin:.2rem 0 .6rem}
.kp{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.kp .panel{flex:1 1 150px}
.kp b{display:block;font-size:1.9rem;color:var(--pri2);line-height:1.1}
.note{background:#fff7e0;border:1px solid #f0d98a;border-radius:8px;padding:.6rem .9rem;font-size:.88rem;margin:.6rem 0}
.v3{position:fixed;inset:0;z-index:5000;background:#000}
.v3 canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.hud{position:absolute;left:0;right:0;display:flex;gap:.5rem;flex-wrap:wrap;padding:.8rem;color:#fff;pointer-events:none}
.hud>*{pointer-events:auto}
.hud.top{top:0;justify-content:space-between;align-items:flex-start;text-shadow:0 1px 6px #000}
.hud.bot{bottom:0;justify-content:center}
.g{border:1px solid #fff6;background:#0b1a2ca8;color:#fff;padding:.5rem 1rem;border-radius:99px;cursor:pointer}
.g.on{background:#fff;color:#111}.g.pri{background:#1b5ea3;border-color:#1b5ea3}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:4.4rem;color:#fff;background:#0007;padding:.3rem .9rem;border-radius:99px;font-size:.88rem;text-align:center;pointer-events:none;max-width:92vw}
.attr{position:absolute;right:.6rem;top:4.2rem;color:#fffc;font-size:.72rem;text-shadow:0 1px 3px #000}
.pad{position:absolute;right:1rem;bottom:6.4rem;display:grid;grid-template-columns:repeat(3,48px);gap:6px}
.pad button{height:48px;border-radius:50%;border:1px solid #fff6;background:#0b1a2ca8;color:#fff;font-size:1.2rem;touch-action:none}
@media(max-width:640px){.pr{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="flag"></div>
<header>
  <div class="brand">
    <svg width="42" height="42" viewBox="0 0 42 42" aria-hidden="true"><circle cx="21" cy="21" r="20" fill="#fff"/><path d="M8 28c5-9 10-13 13-13s8 4 13 13z" fill="#1f8a5b"/><circle cx="21" cy="13" r="4" fill="#c8323f"/></svg>
    <div><b>Qarabağ Aqrar İnvestisiya Portalı<span class="badge">Prototip</span></b><small>Kənd Təsərrüfatı Nazirliyi EKTİS-ə inteqrasiya üçün hazırlanmış hakaton prototipi</small></div>
  </div>
  <div><label for="role" style="display:inline;margin:0 .4rem 0 0;font-weight:400">Demo rolu:</label><select id="role" class="rl" style="width:auto"><option value="user">Sahibkar</option><option value="admin">İnzibatçı</option></select></div>
</header>
<nav id="nav"></nav>
<main id="app"></main>
<div id="toast" class="toast" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const TYPES={1:"Əkinçilik",2:"Heyvandarlıq",3:"Bağçılıq"},ICON={1:"🌾",2:"🐄",3:"🍎"},COL={1:"#2f8f4e",2:"#c9861a",3:"#8a4f9e"};
const MODE={"İ":"İcarə","S":"Satış","O":"Ortaq investisiya"},RENT=[0,300,180,520],SALE=[0,4500,2500,7000];
const PERM={"Lider":"Tam: redaktə, imza, göndərmə","Maliyyə ortağı":"Maliyyə sənədləri və ödənişlər","Texniki ortaq":"Texniki və aqrotexniki sənədlər","Yerli ortaq":"Torpaq və icazə sənədləri","Müşahidəçi":"Yalnız baxış"};
const PLACES=[["Xankəndi",39.82,46.76],["Şuşa",39.76,46.75],["Ağdam",39.99,46.93],["Ağdərə",40.20,46.88],["Tərtər",40.34,46.93],["Xocalı",39.91,46.79],["Əsgəran",39.93,46.84],["Xocavənd",39.79,47.09],["Füzuli",39.60,47.14],["Cəbrayıl",39.40,47.03],["Zəngilan",39.09,46.65],["Qubadlı",39.34,46.58],["Laçın",39.64,46.55],["Kəlbəcər",40.10,46.04],["Bərdə",40.37,47.13],["Ağcabədi",40.05,47.46]];
const RAW=[[39.62,47.17,"Füzuli taxıl sahəsi","Füzuli",120,1,"2026-12-15","İSO","Min. 500 min AZN investisiya"],[39.45,47.33,"Horadiz meyvə bağı","Füzuli",70,3,"2026-12-28","İO","Damcı suvarma tələb olunur"],[39.40,47.03,"Cəbrayıl üzüm bağı","Cəbrayıl",45,3,"2026-11-30","İSO","Müasir suvarma sistemi"],[39.09,46.65,"Zəngilan nar bağı","Zəngilan",60,3,"2026-12-01","İO","İxrac yönümlü biznes plan"],[39.34,46.58,"Qubadlı taxıl və yem sahəsi","Qubadlı",150,1,"2027-02-10","İO","Aqrotexniki plan"],[40.10,46.04,"Kəlbəcər yaylaq otlağı","Kəlbəcər",300,2,"2027-01-05","İ","Mövsümi otarma"],[39.64,46.55,"Laçın alma bağı","Laçın",80,3,"2026-12-20","İO","Soyuducu anbar tələb olunur"],[39.79,47.09,"Xocavənd buğda sahəsi","Xocavənd",95,1,"2026-11-25","İSO","Texnika parkı tələb olunur"],[39.99,46.93,"Ağdam mal-qara fermi","Ağdam",200,2,"2027-01-20","İO","Min. 150 baş mal-qara"],[40.05,47.05,"Ağdam pambıq sahəsi","Ağdam",130,1,"2027-03-01","İSO","Suvarma infrastrukturu"],[40.34,46.93,"Tərtər qoyunçuluq təsərrüfatı","Tərtər",160,2,"2027-01-15","İO","Min. 300 baş"],[40.20,46.88,"Ağdərə şaftalı bağı","Ağdərə",55,3,"2026-12-10","İO","Meyvə emalı üstünlük"],[39.75,46.74,"Şuşa arıçılıq və otlaq","Şuşa",40,2,"2026-12-05","İ","Ekoloji tələblər"],[39.91,46.79,"Xocalı taxıl sahəsi","Xocalı",110,1,"2027-02-01","İSO","Texnika parkı"],[39.81,46.77,"Xankəndi istixana kompleksi","Xankəndi",12,1,"2026-12-12","İ","Enerji səmərəliliyi"],[39.93,46.85,"Əsgəran üzüm bağı","Əsgəran",38,3,"2027-01-25","İO","Emal sexi üstünlük"]];
const PARCELS=RAW.map((r,i)=>({id:i+1,lat:r[0],lng:r[1],name:r[2],rayon:r[3],ha:r[4],type:r[5],deadline:r[6],modes:r[7],terms:r[8]}));
const FLOW=["Qəbul edilib","Baxılır","Əlavə məlumat tələb olunur","Qərar verilib"];
let S={view:"map",role:"user",filter:0,sel:null,cmp:[],apps:[],board:[
 {id:1,parcel:9,leader:"Agro-Qarabağ MMC",role:"Maliyyə ortağı",share:30,note:"Mal-qara kompleksi üçün maliyyə ortağı axtarılır.",req:[]},
 {id:2,parcel:3,leader:"Zəngəzur Bağları ASC",role:"Texniki ortaq",share:20,note:"Üzüm emalı və suvarma texnologiyası bilən ortaq.",req:[]},
 {id:3,parcel:1,leader:"Siz",own:true,role:"Yerli ortaq",share:25,note:"Taxıl sahəsi üçün yerli ortaq.",req:[{n:"Füzuli Agro MMC",st:"Gözləyir"}]}]};
try{const r=JSON.parse(localStorage.getItem("qai_v3")||"null");if(r){S.apps=r.apps||[];S.board=r.board||S.board}}catch(e){}
const sv=()=>{try{localStorage.setItem("qai_v3",JSON.stringify({apps:S.apps,board:S.board}))}catch(e){}};
const $=s=>document.querySelector(s),esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const P=id=>PARCELS.find(p=>p.id==id),sc=s=>"s-"+s.split(" ")[0],list=()=>PARCELS.filter(p=>!S.filter||p.type==S.filter);
const mdl=p=>p.modes.split("").map(m=>`<span class="md">${MODE[m]}</span>`).join("");
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;setTimeout(()=>t.hidden=true,2800)}
function go(v){S.view=v;render();scrollTo(0,0)}
function nav(){const a=[["map","Xəritə"],["cat","İnvestisiya kataloqu"],["new","Müraciət et"],["par","Ortaq axtarışı"],["my","Müraciətlərim"]];
 if(S.role=="admin")a.push(["adm","İdarəetmə paneli"],["api","API / EKTİS"]);
 $("#nav").innerHTML=a.map(([k,l])=>`<button class="${S.view==k?"on":""}" onclick="go('${k}')">${l}</button>`).join("")}
function chips(){return `<div class="chips">`+[[0,"Hamısı"],[1,"Əkinçilik"],[2,"Heyvandarlıq"],[3,"Bağçılıq"]].map(([k,l])=>`<button class="chip ${S.filter==k?"on":""}" onclick="S.filter=${k};S.sel=null;render()">${l}</button>`).join("")+`</div>`}
/* ---- parcel geometry (nümunəvi sərhəd) ---- */
function poly(p){const a=Math.sqrt(p.ha*1e4*1.6),b=a/1.6,r=(p.id*37%180)*Math.PI/180,s=Math.sin(r),c=Math.cos(r);return{a,pts:[[-a/2,-b/2],[a/2,-b/2],[a/2+a*.06,b/2],[-a/2,b/2+b*.08]].map(([x,z])=>[x*c-z*s,x*s+z*c])}}
const toLL=(p,x,z)=>[p.lat-z/111320,p.lng+x/(111320*Math.cos(p.lat*Math.PI/180))];
/* ---- xəritə ---- */
let MAP=null,POLY={};
function mapView(){return `<div class="row"><div style="flex:1 1 100%"><h2>Qarabağ və Şərqi Zəngəzur investisiya xəritəsi</h2><span class="mu">Peyk görüntüsü üzərində açıq təsərrüfat sahələri. Sahəni seçin, 3D peyk görünüşünə keçin.</span>${chips()}</div>
 <div class="panel mapw"><div id="lmap"></div></div><div class="panel side" id="side"></div></div>
 <div class="note">Sahələrin koordinat və sərhədləri nümunəvidir (demo üçün). Real sərhədlər Nazirliyin kadastr məlumatından gələcək.</div>`}
function mapInit(){
 if(MAP){MAP.remove();MAP=null}
 if(typeof L=="undefined"){$("#lmap").innerHTML='<p style="padding:1rem">Xəritə kitabxanası yüklənmədi. İnternet bağlantısını yoxlayın.</p>';return}
 MAP=L.map("lmap",{minZoom:8,maxZoom:18}).fitBounds([[38.95,46.0],[40.5,47.5]]);
 const sat=L.layerGroup([L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:18,attribution:"Peyk: Esri World Imagery"}),L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",{maxZoom:18})]).addTo(MAP);
 const osm=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"});
 L.control.layers({"Peyk görüntüsü":sat,"Sxematik xəritə":osm},{},{position:"topright"}).addTo(MAP);
 PLACES.forEach(([n,la,lo])=>L.circleMarker([la,lo],{radius:3,color:"#fff",weight:1,fillColor:"#c8323f",fillOpacity:1}).bindTooltip(n,{permanent:true,direction:"right",className:"city",offset:[4,0]}).addTo(MAP));
 POLY={};
 list().forEach(p=>{const q=poly(p),ll=q.pts.map(([x,z])=>toLL(p,x,z));
  POLY[p.id]=L.polygon(ll,{color:COL[p.type],weight:2,fillOpacity:.25}).addTo(MAP).on("click",()=>selP(p.id));
  L.marker([p.lat,p.lng],{icon:L.divIcon({className:"",html:`<div class="mk" style="background:${COL[p.type]}">${ICON[p.type]}</div>`,iconSize:[28,28],iconAnchor:[14,14]}),title:p.name}).addTo(MAP).on("click",()=>selP(p.id))});
 side()}
function side(){const p=S.sel&&P(S.sel);$("#side").innerHTML=p?detail(p):`<div><h3>Sahə seçin</h3><p class="mu">Xəritədəki rəngli nişana klikləyin. Yaşıl: əkinçilik, sarı: heyvandarlıq, bənövşəyi: bağçılıq.</p><p class="mu">${PARCELS.length} açıq sahə · ${PARCELS.reduce((t,p)=>t+p.ha,0)} hektar</p></div>`}
function selP(id){S.sel=id;Object.entries(POLY).forEach(([k,v])=>v.setStyle({weight:k==id?4:2,fillOpacity:k==id?.5:.25}));const p=P(id);MAP.flyTo([p.lat,p.lng],14,{duration:.8});side()}
function detail(p){return `<div class="card" style="border:0;border-radius:0"><div class="hd" style="background:${COL[p.type]}">${ICON[p.type]} ${TYPES[p.type]}</div></div><div><h3>${esc(p.name)}</h3><p>${mdl(p)}</p>
 <p><b>Rayon:</b> ${p.rayon}<br><b>Ölçü:</b> ${p.ha} ha<br><b>Koordinat:</b> ${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}<br><b>İcarə:</b> ~${RENT[p.type]} AZN/ha/il${p.modes.includes("S")?`<br><b>Satış:</b> ~${SALE[p.type].toLocaleString()} AZN/ha`:""}<br><b>Son müraciət:</b> ${p.deadline}<br><b>Şərt:</b> ${esc(p.terms)}</p>
 <div class="acts"><button class="btn pri" onclick="open3D(${p.id})">3D peyk görünüşü</button><button class="btn ok" onclick="S.pre=${p.id};go('new')">Müraciət et</button>${p.modes.includes("O")?`<button class="btn" onclick="S.pre=${p.id};go('par')">Ortaq axtar</button>`:""}<button class="btn" onclick="cmp(${p.id})">Müqayisə</button></div></div>`}
function cmp(id){if(!S.cmp.includes(id)){S.cmp.push(id);if(S.cmp.length>3)S.cmp.shift()}toast("Müqayisəyə əlavə edildi ("+S.cmp.length+")");if(S.view=="cat")render()}
function catView(){const c=S.cmp.map(P);
 return `<h2>İnvestisiya imkanları kataloqu</h2>${chips()}<div class="grid">${list().map(p=>`<div class="card"><div class="hd" style="background:${COL[p.type]}">${ICON[p.type]} ${TYPES[p.type]}</div><div class="cb"><h3>${esc(p.name)}</h3><p>${mdl(p)}</p><p class="mu">${p.rayon} · ${p.ha} ha · son tarix ${p.deadline}<br>${esc(p.terms)}</p><div class="acts"><button class="btn pri sm" onclick="open3D(${p.id})">3D peyk</button><button class="btn ok sm" onclick="S.pre=${p.id};go('new')">Müraciət</button><button class="btn sm" onclick="cmp(${p.id})">Müqayisə</button></div></div></div>`).join("")}</div>
 ${c.length>1?`<h3 style="margin-top:1.5rem">Müqayisə <button class="btn sm" onclick="S.cmp=[];render()">Təmizlə</button></h3><div class="panel scroll"><table><tr><th></th>${c.map(p=>`<th>${esc(p.name)}</th>`).join("")}</tr>${[["Rayon","rayon"],["Ölçü (ha)","ha"],["Son tarix","deadline"],["Şərtlər","terms"]].map(([l,k])=>`<tr><th>${l}</th>${c.map(p=>`<td>${esc(p[k])}</td>`).join("")}</tr>`).join("")}<tr><th>İcarə AZN/ha</th>${c.map(p=>`<td>${RENT[p.type]}</td>`).join("")}</tr></table></div>`:S.cmp.length?`<p class="mu">Müqayisə üçün ən azı 2 sahə seçin.</p>`:""}`}
/* ---- müraciət (fərdi / konsorsium) ---- */
let DR={kind:"solo",pr:[{name:"",voen:"",share:20,role:"Maliyyə ortağı"}]};
function newView(){const pid=S.pre||1;
 return `<h2>Elektron müraciət</h2><div class="panel" style="max-width:820px"><form id="f" onsubmit="return false">
 <fieldset class="fs"><legend>1. Sahə və əməliyyat</legend><label for="fp">Təsərrüfat sahəsi</label><select id="fp" onchange="S.pre=+this.value;modes()">${PARCELS.map(p=>`<option value="${p.id}" ${p.id==pid?"selected":""}>${esc(p.name)} (${p.ha} ha)</option>`).join("")}</select>
