<!DOCTYPE html>
<html lang="az" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('EKTİS inteqrasiyası')}"></head>
<body class="bg-gray-50 text-gray-900">
<header th:replace="~{layout :: header}"></header>
<div th:replace="~{layout :: flash}"></div>
<main class="max-w-7xl mx-auto px-4 py-6 space-y-4">
    <nav th:replace="~{app-fragments :: staffNav('ektis')}"></nav>
    <div class="flex flex-wrap items-center gap-3">
        <h1 class="text-2xl font-bold">EKTİS inteqrasiyası</h1>
        <span class="px-2 py-0.5 rounded bg-blue-100 text-blue-800 text-sm font-medium" th:text="'Rejim: ' + ${mode}"></span>
        <span th:if="${mockFail}" class="px-2 py-0.5 rounded bg-red-100 text-red-800 text-sm font-medium">Mock xəta rejimi aktivdir</span>
        <form sec:authorize="hasRole('ADMIN')" th:if="${isMock}" th:action="@{/idare/inteqrasiya/xeta-rejimi}" method="post" class="ml-auto">
            <button class="px-3 py-1.5 rounded border text-sm bg-white hover:bg-gray-50"
                    th:text="${mockFail} ? 'Mock-u normal rejimə qaytar' : 'Mock xəta rejimini aç (test)'"></button>
        </form>
    </div>
    <p class="text-sm text-gray-600">Komissiya qərarları Kənd Təsərrüfatı Nazirliyinin EKTİS sisteminə göndərilir. MVP-də adapter simulyasiya (mock) rejimindədir.</p>
    <div class="bg-white rounded-lg shadow overflow-x-auto">
        <table class="w-full text-sm">
            <tr class="text-left text-gray-500 bg-earth-50"><th class="p-3">Vaxt</th><th>Müraciət</th><th>Əməliyyat</th><th>Status</th><th>EKTİS ref</th><th class="text-right pr-3">ms</th><th></th></tr>
            <tr th:if="${logs.isEmpty()}"><td colspan="7" class="p-4 text-gray-500">Göndəriş yoxdur.</td></tr>
            <th:block th:each="l : ${logs}">
                <tr class="border-t align-top">
                    <td class="p-3 whitespace-nowrap" th:text="${@fmt.dateTime(l.at)}"></td>
                    <td th:text="${l.applicationNumber}"></td>
                    <td class="font-mono text-xs" th:text="${l.operation}"></td>
                    <td><span th:class="${@statusLabels.badge(l.status)}" th:text="${@statusLabels.label(l.status)}"></span></td>
                    <td class="font-mono text-xs" th:text="${l.ektisRef} ?: '—'"></td>
                    <td class="text-right pr-3" th:text="${l.durationMs}"></td>
                    <td class="pr-3 text-right">
                        <form sec:authorize="hasRole('ADMIN')" th:if="${l.status.name() == 'FAILED'}" th:action="@{/idare/inteqrasiya/{id}/yeniden(id=${l.id})}" method="post">
                            <button class="px-3 py-1 rounded bg-amber-600 text-white text-xs hover:bg-amber-700">Yenidən göndər</button>
                        </form>
                    </td>
                </tr>
                <tr><td colspan="7" class="px-3 pb-3">
                    <details class="text-xs"><summary class="cursor-pointer text-leaf-700">Sorğu / cavab (JSON)</summary>
                        <div class="grid md:grid-cols-2 gap-3 mt-2">
                            <pre class="bg-gray-900 text-green-200 rounded p-3 overflow-x-auto" th:text="${pretty[l.id][0]}"></pre>
                            <pre class="bg-gray-900 text-green-200 rounded p-3 overflow-x-auto" th:text="${pretty[l.id][1]}"></pre>
                        </div>
                    </details>
                </td></tr>
            </th:block>
        </table>
    </div>
</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
