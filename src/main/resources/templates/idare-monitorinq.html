<!DOCTYPE html>
<html lang="az" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Monitorinq')}"></head>
<body class="bg-gray-50 text-gray-900">
<header th:replace="~{layout :: header}"></header>
<div th:replace="~{layout :: flash}"></div>
<main class="max-w-7xl mx-auto px-4 py-6 space-y-4">
    <nav th:replace="~{app-fragments :: staffNav('monitor')}"></nav>
    <h1 class="text-2xl font-bold">Təsərrüfat layihələrinin monitorinqi</h1>
    <div class="bg-white rounded-lg shadow overflow-x-auto">
        <table class="w-full text-sm">
            <tr class="text-left text-gray-500 bg-earth-50"><th class="p-3">Müraciət</th><th>İnvestor</th><th>Sahə</th><th>Rayon</th>
                <th class="text-right">İnvestisiya</th><th class="text-right">İş yerləri</th><th class="text-right">Yerli</th>
                <th class="text-right">Gecikən</th><th class="pl-4">Son hesabat</th><th>Risk</th></tr>
            <tr th:if="${views.isEmpty()}"><td colspan="10" class="p-4 text-gray-500">Layihə yoxdur.</td></tr>
            <tr th:each="v : ${views}" th:with="p=${v.progress}" class="border-t hover:bg-gray-50">
                <td class="p-3"><a th:href="@{/idare/monitorinq/{id}(id=${v.project.id})}" class="text-leaf-700 font-medium underline" th:text="${v.project.sourceLabel()}"></a></td>
                <td th:text="${v.project.investor.fullName}"></td>
                <td th:text="${v.project.plot.code}"></td>
                <td th:text="${v.project.plot.district}"></td>
                <td class="text-right" th:text="${p.investmentPct} + '%'"></td>
                <td class="text-right" th:text="${p.workers} + ' / ' + ${v.project.committedJobs} + ' (' + ${p.jobsPct} + '%)'"></td>
                <td class="text-right" th:text="${p.localPct} + '%'"></td>
                <td class="text-right" th:classappend="${p.delayedTasks > 0} ? 'text-red-700 font-semibold'" th:text="${p.delayedTasks}"></td>
                <td class="pl-4" th:text="${p.lastReport == null} ? '—' : ${p.lastReport.period} + ' · ' + ${@fmt.date(p.lastReport.submittedAt.toLocalDate())}"></td>
                <td><span th:if="${p.risk.name() == 'ACTIVE'}" class="inline-block px-2 py-0.5 rounded text-xs font-medium bg-green-100 text-green-800">Plan üzrə</span>
                    <span th:if="${p.risk.name() == 'AT_RISK'}" class="inline-block px-2 py-0.5 rounded text-xs font-medium bg-red-100 text-red-800"
                          th:title="${#strings.listJoin(p.riskReasons, '; ')}">Risk var</span></td>
            </tr>
        </table>
    </div>
</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
