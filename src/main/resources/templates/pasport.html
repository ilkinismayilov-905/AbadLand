<!DOCTYPE html>
<html lang="az" th:lang="${@i18n.lang()}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head(#{plots.passport.title(${plot.code})})}"></head>
<body class="bg-gray-50 text-gray-900">
<header th:replace="~{layout :: header}"></header>
<div th:replace="~{layout :: flash}"></div>
<main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

    <!-- Header -->
    <section class="bg-white rounded-lg shadow p-5 flex flex-wrap items-start gap-4">
        <div class="flex-1 min-w-[260px]">
            <div class="text-sm text-gray-500" th:text="${plot.code} + ' · ' + ${@statusLabels.label(plot.economicRegion)}"></div>
            <h1 class="text-3xl font-bold" th:text="${plot.name}"></h1>
            <div class="text-gray-600" th:text="#{plots.passport.location(${plot.district}, ${plot.village}, ${@fmt.dec(plot.areaHa)})}"></div>
            <div class="flex flex-wrap gap-1 mt-2">
                <span th:class="${@statusLabels.badge(plot.purpose)}" th:text="${@statusLabels.label(plot.purpose)}"></span>
                <span th:class="${@statusLabels.badge(plot.demining)}" th:text="${@statusLabels.label(plot.demining)}"></span>
            </div>
            <p class="mt-3 text-sm text-gray-700" th:text="${plot.description}"></p>
            <p th:if="${plot.conceptLinkToAgri != null}" class="mt-2 text-sm text-gray-700"><b th:text="#{listing.f.concept} + ': '"></b><span th:text="${plot.conceptLinkToAgri}"></span></p>
            <p th:unless="${plot.published}" class="mt-2 p-2 rounded bg-amber-50 border border-amber-200 text-sm text-amber-900" th:text="#{listing.draftNotice(${@statusLabels.label(plot.listingStatus)})}"></p>
        </div>
        <div th:if="${matchScore != null}" class="rounded-lg bg-leaf-50 border border-leaf-100 px-5 py-3 text-center">
            <div class="text-3xl font-bold text-leaf-700" th:text="${matchScore} + '/100'"></div>
            <div class="text-xs text-gray-600" th:text="#{plots.passport.matchScore}"></div>
        </div>
    </section>

    <!-- Photo gallery (staff listings; first = cover) -->
    <section th:unless="${photos.isEmpty()}" class="bg-white rounded-lg shadow p-3" th:attr="aria-label=#{listing.gallery}">
        <div class="flex gap-2 overflow-x-auto">
            <a th:each="ph : ${photos}" th:href="@{/saheler/{id}/foto/{d}(id=${plot.id},d=${ph.id})}" target="_blank" class="shrink-0">
                <img th:src="@{/saheler/{id}/foto/{d}(id=${plot.id},d=${ph.id})}" th:alt="${plot.name}" class="h-44 w-64 object-cover rounded-lg bg-gray-100" loading="lazy"></a>
        </div>
    </section>

    <div class="grid lg:grid-cols-3 gap-6">
        <div class="lg:col-span-2 space-y-6 min-w-0 break-words">
            <!-- Investor questions -->
            <section class="bg-white rounded-lg shadow p-5">
                <h2 class="font-semibold mb-3" th:text="#{plots.passport.questions}"></h2>
                <div class="grid sm:grid-cols-2 md:grid-cols-3 gap-3 text-sm">
                    <div th:class="'rounded p-3 border-l-4 ' + (${plot.demining.name() == 'CLEARED'} ? 'border-green-500 bg-green-50' : (${plot.demining.name() == 'PARTIALLY_CLEARED'} ? 'border-amber-500 bg-amber-50' : 'border-red-500 bg-red-50'))">
                        <div class="text-gray-500" th:text="#{plots.passport.demined}"></div>
                        <div class="font-semibold" th:text="${@statusLabels.label(plot.demining)}"></div></div>
                    <div th:class="'rounded p-3 border-l-4 ' + (${plot.irrigation} ? 'border-green-500 bg-green-50' : 'border-amber-500 bg-amber-50')">
                        <div class="text-gray-500" th:text="#{plots.passport.water}"></div>
                        <div class="font-semibold" th:text="${plot.waterSource} + ' · ' + (${plot.irrigation} ? #{plots.passport.irrigationYes} : #{plots.passport.irrigationNo})"></div></div>
                    <div class="rounded p-3 border-l-4 border-green-500 bg-green-50">
                        <div class="text-gray-500" th:text="#{plots.passport.soil}"></div>
                        <div class="font-semibold" th:text="${plot.soilType}"></div></div>
                    <div th:class="'rounded p-3 border-l-4 ' + (${plot.roadKm <= 5} ? 'border-green-500 bg-green-50' : (${plot.roadKm <= 15} ? 'border-amber-500 bg-amber-50' : 'border-red-500 bg-red-50'))">
                        <div class="text-gray-500" th:text="#{plots.passport.roadDistance}"></div>
                        <div class="font-semibold" th:text="${@fmt.dec(plot.roadKm)} + ' km'"></div></div>
                    <div th:class="'rounded p-3 border-l-4 ' + (${plot.electricity} ? 'border-green-500 bg-green-50' : 'border-red-500 bg-red-50')">
                        <div class="text-gray-500" th:text="#{plots.passport.electricity}"></div>
                        <div class="font-semibold" th:text="${plot.electricity} ? #{plots.passport.yes} : #{plots.passport.no}"></div></div>
                    <div th:if="${climate != null}" class="rounded p-3 border-l-4 border-blue-400 bg-blue-50">
                        <div class="text-gray-500" th:text="#{plots.passport.climate}"></div>
                        <div class="font-semibold" th:text="#{plots.passport.climateShort(${climate.elevationM + ''}, ${@fmt.dec(climate.meanTempC)}, ${@fmt.num(climate.precipMm)})}"></div></div>
                </div>
            </section>

            <!-- Climate -->
            <section th:if="${climate != null}" class="bg-white rounded-lg shadow p-5">
                <div class="flex flex-wrap items-center gap-2 mb-3">
                    <h2 class="font-semibold" th:text="#{plots.passport.climate}"></h2>
                    <span th:if="${climate.fetchedAt != null}" class="text-xs text-gray-500"
                          th:text="#{plots.passport.climateSource(${@fmt.dateTime(climate.fetchedAt)})}"></span>
                    <span th:if="${climate.fetchedAt == null}" class="text-xs px-2 py-0.5 rounded bg-yellow-100 text-yellow-800" th:text="#{plots.passport.climateNotUpdated}"></span>
                </div>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-center">
                    <div class="rounded bg-blue-50 p-3"><div class="text-xs text-gray-500" th:text="#{plots.passport.elevation}"></div><div class="text-xl font-bold" th:text="${climate.elevationM} + ' m'"></div></div>
                    <div class="rounded bg-blue-50 p-3"><div class="text-xs text-gray-500" th:text="#{plots.passport.meanTemp}"></div><div class="text-xl font-bold" th:text="${@fmt.dec(climate.meanTempC)} + ' °C'"></div>
                        <div class="text-xs text-gray-500" th:text="'min ' + ${@fmt.dec(climate.absMinTempC)} + ' °C'"></div></div>
                    <div class="rounded bg-blue-50 p-3"><div class="text-xs text-gray-500" th:text="#{plots.passport.frostDays}"></div><div class="text-xl font-bold" th:text="${climate.frostDays}"></div></div>
                    <div class="rounded bg-blue-50 p-3"><div class="text-xs text-gray-500" th:text="#{plots.passport.precip}"></div><div class="text-xl font-bold" th:text="${@fmt.num(climate.precipMm)} + ' mm'"></div></div>
                </div>
            </section>

            <!-- Suitability -->
            <section class="bg-white rounded-lg shadow p-5">
                <h2 class="font-semibold mb-3" th:text="#{plots.passport.suitability}"></h2>
                <p th:if="${card.suitability.isEmpty()}" class="text-sm text-gray-500" th:text="#{plots.passport.noSuitability}"></p>
                <span th:replace="~{layout :: suitChips(${card.suitability})}"></span>
                <p class="mt-2 text-xs text-gray-500" th:text="#{plots.passport.suitabilitySource}"></p>
            </section>

            <!-- ROI + prediction -->
            <section th:if="${roi != null}" class="bg-white rounded-lg shadow p-5 space-y-4">
                <div class="flex flex-wrap items-center gap-3">
                    <h2 class="font-semibold" th:text="#{plots.passport.roiTitle}"></h2>
                    <span class="text-xs px-2 py-0.5 rounded bg-yellow-100 text-yellow-800" th:text="#{plots.testValue}"></span>
                    <form method="get" class="ml-auto text-sm flex gap-2 items-center">
                        <input th:if="${matchScore != null}" type="hidden" name="score" th:value="${matchScore}">
                        <label for="crop" th:text="#{plots.passport.crop}"></label>
                        <select id="crop" name="crop" class="border rounded px-2 py-1" onchange="this.form.submit()">
                            <option th:each="c : ${cropOptions}" th:value="${c.code}" th:text="${c.name}" th:selected="${c.id == selectedCrop.id}"></option>
                        </select>
                        <noscript><button class="px-2 py-1 border rounded" th:text="#{plots.passport.calculate}"></button></noscript>
                    </form>
                </div>
                <div class="grid sm:grid-cols-4 gap-3 text-center">
                    <div class="rounded bg-earth-50 p-3"><div class="text-xs text-gray-500" th:text="#{plots.passport.investment}"></div><div class="font-bold" th:text="${@fmt.money(roi.investment)}"></div></div>
                    <div class="rounded bg-earth-50 p-3"><div class="text-xs text-gray-500" th:text="#{plots.passport.annualNet}"></div><div class="font-bold" th:text="${@fmt.money(roi.annualNet)}"></div></div>
                    <div class="rounded bg-earth-50 p-3"><div class="text-xs text-gray-500" th:text="#{plots.passport.payback}"></div><div class="font-bold" th:text="${roi.payback == null} ? '—' : #{plots.years(${@fmt.dec(roi.payback)})}"></div></div>
                    <div class="rounded bg-earth-50 p-3"><div class="text-xs text-gray-500" th:text="#{plots.passport.yieldForecast}"></div><div class="font-bold" th:text="#{plots.passport.tonsPerYear(${@fmt.dec(roi.yieldTons)})}"></div></div>
                </div>
                <div>
                    <h3 class="text-sm font-semibold mb-2" th:text="#{plots.passport.scenarios}"></h3>
                    <table class="w-full text-sm">
                        <tr class="text-left text-gray-500"><th class="py-1" th:text="#{plots.passport.scenario}"></th><th th:text="#{plots.passport.revenue}"></th><th th:text="#{plots.passport.firstHarvest}"></th><th th:text="#{plots.passport.payback}"></th><th th:text="#{plots.passport.cumulative10}"></th><th class="w-1/3"></th></tr>
                        <tr th:each="s : ${roi.scenarios}" class="border-t">
                            <td class="py-2 font-medium" th:text="${s.name}"></td>
                            <td th:text="'×' + ${@fmt.dec(s.revenueFactor)}"></td>
                            <td th:text="#{plots.passport.yearN(${s.firstHarvestYear})}"></td>
                            <td th:text="${s.payback == null} ? '—' : #{plots.years(${@fmt.dec(s.payback)})}"></td>
                            <td th:class="${s.cumulative10 < 0} ? 'text-red-600' : 'text-leaf-700'" th:text="${@fmt.money(s.cumulative10)}"></td>
                            <td><div class="h-3 rounded" th:classappend="${s.cumulative10 < 0} ? 'bg-red-400' : 'bg-leaf-500'"
                                     th:style="'width:' + ${roi.barPercent(s)} + '%'"></div></td>
                        </tr>
                    </table>
                </div>
                <div>
                    <h3 class="text-sm font-semibold mb-2" th:text="#{plots.passport.riskForecast}"></h3>
                    <div class="grid sm:grid-cols-3 gap-3 text-sm">
                        <div th:each="r : ${roi.risks}" class="rounded border p-3">
                            <div class="flex justify-between items-center"><span class="font-medium" th:text="${r.name}"></span>
                                <span th:class="${@statusLabels.badge(r.level)}" th:text="${@statusLabels.label(r.level)}"></span></div>
                            <div class="text-xs text-gray-600 mt-1" th:text="${r.text}"></div>
                        </div>
                    </div>
                </div>
                <p class="text-xs text-gray-500" th:text="#{plots.passport.forecastNote}"></p>
            </section>

            <!-- Satellite + AI -->
            <section id="ai" class="bg-white rounded-lg shadow p-5 space-y-4">
                <div class="flex flex-wrap items-center gap-3">
                    <h2 class="font-semibold" th:text="#{plots.passport.aiTitle}"></h2>
                    <span th:if="${aiSample}" class="text-xs px-2 py-0.5 rounded bg-gray-200 text-gray-700" th:text="#{plots.passport.aiSample}"></span>
                    <span th:if="${aiAnalysis != null and !aiSample}" class="text-xs text-gray-500"
                          th:text="${aiAnalysis.model} + ' · ' + ${@fmt.dateTime(aiAnalysis.createdAt)}"></span>
                </div>
                <div class="grid md:grid-cols-2 gap-4">
                    <figure>
                        <img th:src="@{/saheler/{id}/peyk.jpg(id=${plot.id})}" th:alt="#{plots.passport.satAlt}" loading="lazy"
                             class="w-full aspect-square object-cover rounded bg-gray-100"
                             th:data-unavailable="#{plots.passport.satUnavailable}"
                             onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'w-full aspect-square rounded bg-gray-100 flex items-center justify-center text-sm text-gray-500',textContent:this.dataset.unavailable}))">
                        <figcaption class="text-xs text-gray-500 mt-1" th:text="#{plots.passport.satCredit}"></figcaption>
                    </figure>
                    <div class="space-y-3 text-sm">
                        <form sec:authorize="isAuthenticated()" th:action="@{/saheler/{id}/ai-analiz(id=${plot.id})}" method="post"
                              th:data-busy="#{plots.passport.aiBusy}" onsubmit="const b=this.querySelector('button');b.disabled=true;b.textContent=this.dataset.busy;">
                            <button th:disabled="${!aiConfigured}"
                                    class="w-full px-4 py-2 rounded bg-blue-700 text-white font-semibold hover:bg-blue-800 disabled:bg-gray-300 disabled:text-gray-600 disabled:cursor-not-allowed"
                                    th:text="${aiAnalysis != null and !aiSample} ? #{plots.passport.aiView} : #{plots.passport.aiRun}"></button>
                        </form>
                        <form sec:authorize="hasRole('ADMIN')" th:if="${aiConfigured and aiAnalysis != null and !aiSample}"
                              th:action="@{/saheler/{id}/ai-analiz(id=${plot.id},yeniden=1)}" method="post"
                              th:data-busy="#{plots.passport.aiBusy}" onsubmit="const b=this.querySelector('button');b.disabled=true;b.textContent=this.dataset.busy;">
                            <button class="w-full px-4 py-1.5 rounded border text-sm hover:bg-gray-50" th:text="#{plots.passport.aiRerun}"></button>
                        </form>
                        <p th:unless="${aiConfigured}" class="text-xs text-gray-500" th:text="#{plots.passport.aiNoKey}"></p>
                        <p sec:authorize="isAnonymous()" class="text-xs text-gray-500">[[#{plots.passport.aiLoginBefore}]] <a th:href="@{/giris}" class="underline" th:text="#{plots.passport.aiLoginLink}"></a>[[#{plots.passport.aiLoginAfter}]]</p>
                        <div th:if="${ai != null}" class="space-y-2">
                            <p class="font-medium" th:text="${ai.summary}"></p>
                            <div><span class="text-gray-500" th:text="#{plots.passport.landCover}"></span> <span th:text="${ai.landCover}"></span></div>
                            <div><span class="text-gray-500" th:text="#{plots.passport.terrain}"></span> <span th:text="${ai.terrain}"></span></div>
                            <div><span class="text-gray-500" th:text="#{plots.passport.waterSigns}"></span> <span th:text="${ai.waterSigns}"></span></div>
                            <div><span class="text-gray-500" th:text="#{plots.passport.confidence}"></span> <b th:text="${ai.confidenceLabel()}"></b></div>
                        </div>
                        <p th:if="${ai == null}" class="text-gray-500" th:text="#{plots.passport.aiNone}"></p>
                    </div>
                </div>
                <div th:if="${ai != null}" class="grid md:grid-cols-2 gap-4 text-sm">
                    <div>
                        <h3 class="font-semibold mb-2" th:text="#{plots.passport.aiSuitable}"></h3>
                        <div th:each="c : ${ai.suitableCrops}" class="mb-2" th:with="sc=${c.score} ?: 0">
                            <div class="flex justify-between"><span th:text="${c.name}"></span><b th:text="${sc} + '%'"></b></div>
                            <div class="h-2 rounded bg-gray-100"><div class="h-2 rounded bg-leaf-500" th:style="'width:' + ${sc} + '%'"></div></div>
                            <div class="text-xs text-gray-500" th:text="${c.reason}"></div>
                        </div>
                        <h3 th:if="${ai.notRecommended != null and !ai.notRecommended.isEmpty()}" class="font-semibold mt-3 mb-1" th:text="#{plots.passport.aiNotRecommended}"></h3>
                        <ul class="space-y-1"><li th:each="n : ${ai.notRecommended}" class="text-red-700" th:text="'✗ ' + ${n.name} + ' — ' + ${n.reason}"></li></ul>
                    </div>
                    <div class="space-y-3">
                        <div th:if="${ai.observations != null and !ai.observations.isEmpty()}"><h3 class="font-semibold mb-1" th:text="#{plots.passport.aiObservations}"></h3>
                            <ul class="list-disc ml-5"><li th:each="o : ${ai.observations}" th:text="${o}"></li></ul></div>
                        <div><h3 class="font-semibold mb-1" th:text="#{plots.passport.aiRisks}"></h3>
                            <ul class="space-y-1">
                                <li th:each="r : ${ai.risks}" class="flex gap-2 items-start">
                                    <span th:if="${r.levelEnum() != null}" th:class="${@statusLabels.badge(r.levelEnum())} + ' shrink-0 mt-0.5'" th:text="${@statusLabels.label(r.levelEnum())}"></span>
                                    <span th:unless="${r.levelEnum() != null}" class="shrink-0" aria-hidden="true">•</span>
                                    <span><b th:if="${r.reason != null}" th:text="${r.title}"></b><span th:if="${r.reason != null}" th:text="' — ' + ${r.reason}"></span><span th:if="${r.reason == null}" th:text="${r.title}"></span></span>
                                </li>
                            </ul></div>
                        <div><h3 class="font-semibold mb-1" th:text="#{plots.passport.aiIrrigation}"></h3><p th:text="${ai.irrigationAdvice}"></p></div>
                        <div th:if="${ai.recommendedChecks != null and !ai.recommendedChecks.isEmpty()}"><h3 class="font-semibold mb-1" th:text="#{plots.passport.aiChecks}"></h3>
                            <ul class="list-disc ml-5"><li th:each="k : ${ai.recommendedChecks}" th:text="${k}"></li></ul></div>
                        <div th:if="${ai.dataGaps != null and !ai.dataGaps.isEmpty()}"><h3 class="font-semibold mb-1" th:text="#{plots.passport.aiDataGaps}"></h3>
                            <ul class="list-disc ml-5 text-gray-600"><li th:each="g : ${ai.dataGaps}" th:text="${g}"></li></ul></div>
                    </div>
                </div>
                <p class="text-xs text-gray-500 border-t pt-3" th:text="#{plots.passport.aiDisclaimer}"></p>
            </section>
        </div>

        <aside class="space-y-6 min-w-0 break-words">
            <section class="bg-white rounded-lg shadow p-5">
                <h2 class="font-semibold mb-3" th:text="#{plots.passport.competition}"></h2>
                <div th:if="${card.competition == null}" class="text-sm text-gray-500" th:text="#{plots.passport.noCompetition}"></div>
                <div th:if="${card.competition != null}" class="space-y-2 text-sm">
                    <div class="font-medium" th:text="${card.competition.code} + ' — ' + ${card.competition.title}"></div>
                    <div>[[#{plots.passport.deadline}]] <span th:text="${@fmt.date(card.competition.deadline)}"></span>
                        (<span th:class="${card.daysLeft <= 7} ? 'text-red-600 font-semibold' : ''" th:text="#{plots.daysLeft(${card.daysLeft})}"></span>)</div>
                    <div>[[#{plots.minInvestment}]] <span th:text="${@fmt.money(card.competition.minInvestment)}"></span></div>
                    <a sec:authorize="!hasAnyRole('OPERATOR','COMMISSION','ADMIN')" th:href="@{/kabinet/muraciet/yeni(plotId=${plot.id})}" class="block text-center mt-3 py-2 rounded bg-leaf-600 text-white font-semibold hover:bg-leaf-700" th:text="#{plots.passport.apply}"></a>
                </div>
            </section>
            <section th:unless="${plotAuctions.isEmpty()}" class="bg-white rounded-lg shadow p-5 text-sm space-y-2">
                <h2 class="font-semibold" th:text="#{plots.passport.auction}"></h2>
                <a th:each="x : ${plotAuctions}" th:href="@{/herraclar/{id}(id=${x.id})}" class="flex items-center gap-2 hover:underline">
                    <span th:text="${x.code}"></span>
                    <span th:class="${@statusLabels.badge(x.dealType)}" th:text="${@statusLabels.label(x.dealType)}"></span>
                    <span th:class="${@statusLabels.badge(x.status)}" th:text="${@statusLabels.label(x.status)}"></span>
                    <span class="ml-auto" th:text="${@fmt.money(x.currentPrice != null ? x.currentPrice : x.startPrice)}"></span>
                </a>
            </section>
            <section class="bg-white rounded-lg shadow p-5 text-sm space-y-1">
                <h2 class="font-semibold mb-2" th:text="#{plots.passport.terms}"></h2>
                <div>[[#{plots.passport.leaseTerm}]] <b th:text="#{plots.years(${plot.leaseYears})}"></b></div>
                <div>[[#{plots.passport.leaseFee}]] <b th:text="#{plots.passport.perHaYear(${@fmt.money(plot.feePerHa)})}"></b></div>
                <div>[[#{plots.passport.annualTotal}]] <b th:text="${@fmt.money(plot.feePerHa * plot.areaHa)}"></b></div>
            </section>
            <section class="bg-white rounded-lg shadow p-2">
                <div id="miniMap" class="w-full rounded" style="height: 280px"></div>
            </section>
        </aside>
    </div>
</main>
<footer th:replace="~{layout :: footer}"></footer>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script th:src="@{/js/map.js}"></script>
<th:block th:replace="~{layout :: scripts3d}"></th:block>
<script th:inline="javascript">
    const m = createMap('miniMap', true, /*[[${plot3d}]]*/ null);
    drawPlots(m, [{ id: /*[[${plot.id}]]*/ 0, purpose: /*[[${plot.purpose.name()}]]*/ '', geoJson: /*[[${plot.geoJson}]]*/ '{}' }], false, true);
</script>
</body>
</html>
