<!DOCTYPE html>
<html lang="az" th:lang="${@i18n.lang()}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head(#{listing.wizard.title})}"></head>
<body class="bg-gray-50 text-gray-900">
<header th:replace="~{layout :: header}"></header>
<div th:replace="~{layout :: flash}"></div>
<main class="max-w-5xl mx-auto px-4 py-6 space-y-5" th:with="base=${p == null ? null : '/idare/elan/' + p.id}">
    <nav th:replace="~{app-fragments :: staffNav('listings')}"></nav>
    <div class="flex flex-wrap items-center gap-3">
        <h1 class="text-2xl font-bold" th:text="${p == null} ? #{listing.wizard.title} : ${p.code} + ' · ' + (${p.name} ?: #{listing.untitled})"></h1>
        <span th:if="${p != null}" th:class="${@statusLabels.badge(p.listingStatus)}" th:text="${@statusLabels.label(p.listingStatus)}"></span>
        <a th:href="@{/idare/elanlar}" class="ml-auto text-sm text-leaf-700 underline" th:text="#{listing.backToList}"></a>
    </div>

    <!-- Stepper: Torpaq → Təyinat → Sahə məlumatları və şərtlər → Sənədlər və fotolar -->
    <ol class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-sm" th:attr="aria-label=#{listing.wizard.steps}">
        <li th:each="n : ${#numbers.sequence(1, 4)}">
            <a th:href="${p == null} ? '#' : ${base} + '/addim/' + ${n}" th:attr="aria-current=${n == step} ? 'step'"
               th:class="'flex items-center gap-2 rounded-xl px-3 py-2 border ' + (${n == step} ? 'bg-[#2E6B3A] text-white border-[#2E6B3A]' : 'bg-white border-[#DDE3DC]') + (${p == null and n > 1} ? ' pointer-events-none opacity-50' : '')">
                <b th:text="${n}"></b><span th:text="#{${'listing.wizard.step' + n}}"></span></a>
        </li>
    </ol>
    <p th:if="${p != null and step < 4}" class="text-xs text-gray-500"><span th:text="#{listing.wizard.autosaveNote}"></span> <span id="autosave-state" aria-live="polite"></span></p>

    <div th:if="${formErrors != null}" class="p-3 rounded-lg bg-red-50 border border-red-200 text-sm" role="alert">
        <b th:text="#{listing.wizard.fixErrors}"></b>
        <ul class="list-disc ml-5 text-red-800"><li th:each="m : ${formErrors}" th:text="${m}"></li></ul></div>

    <!-- 1. Torpaq -->
    <form th:if="${step == 1}" th:action="${p == null} ? @{/idare/elan/yeni} : ${base} + '/addim/1'" th:object="${f}" method="post"
          class="card p-5 space-y-4" th:attr="data-autosave=${p != null}">
        <div>
            <span class="field-label" th:text="#{listing.f.polygon}"></span>
            <div id="draw-map" class="w-full h-[400px] rounded-[14px] border border-[#DDE3DC]"></div>
            <div class="flex flex-wrap items-center gap-2 mt-2">
                <button type="button" id="draw-undo" class="btn-secondary !min-h-[38px]" th:text="#{listing.f.undo}"></button>
                <button type="button" id="draw-reset" class="btn-secondary !min-h-[38px]" th:text="#{listing.f.reset}"></button>
                <span id="draw-info" class="text-sm text-gray-600" aria-live="polite"></span>
            </div>
            <input type="hidden" th:field="*{geoJson}" id="geoJson">
            <details class="mt-2 text-sm"><summary class="cursor-pointer text-leaf-700" th:text="#{listing.f.pasteGeo}"></summary>
                <label class="sr-only" for="geoPaste" th:text="#{listing.f.pasteGeo}"></label>
                <textarea id="geoPaste" rows="3" class="field !h-auto py-2 mt-2 font-mono text-xs" placeholder='{"type":"Polygon","coordinates":[[[46.9,39.6],...]]}'></textarea>
                <button type="button" id="draw-paste" class="btn-secondary !min-h-[38px] mt-2" th:text="#{listing.f.applyGeo}"></button>
            </details>
        </div>
        <div class="grid sm:grid-cols-4 gap-4">
            <label class="block"><span class="field-label" th:text="#{listing.f.area}"></span>
                <input th:field="*{areaHa}" id="areaHa" type="number" min="0.5" max="5000" step="0.1" class="field"></label>
            <label class="block"><span class="field-label" th:text="#{listing.f.region}"></span>
                <select id="region" class="field">
                    <option value="" th:text="#{listing.f.all}"></option>
                    <option th:each="r : ${regions}" th:value="${r}" th:text="${@statusLabels.label(r)}"
                            th:selected="${f.district != null and districtRegions.get(f.district) == r}"></option>
                </select></label>
            <label class="block"><span class="field-label" th:text="#{listing.f.district}"></span>
                <select th:field="*{district}" class="field" required>
                    <option value="" th:text="#{listing.f.choose}"></option>
                    <option th:each="d : ${districtRegions}" th:value="${d.key}" th:text="${d.key}" th:attr="data-region=${d.value}"></option>
                </select></label>
            <label class="block"><span class="field-label" th:text="#{listing.f.village}"></span>
                <input th:field="*{village}" class="field" maxlength="80"></label>
        </div>
        <div class="flex flex-wrap gap-2 justify-end">
            <button th:if="${p != null}" class="btn-secondary" th:text="#{listing.wizard.save}"></button>
            <button name="next" value="1" class="btn-primary" th:text="#{listing.wizard.saveNext}"></button>
        </div>
    </form>

    <!-- 2. Təyinat -->
    <form th:if="${step == 2}" th:action="${base} + '/addim/2'" th:object="${f}" method="post" class="card p-5 space-y-4" data-autosave="true">
        <label class="block"><span class="field-label" th:text="#{listing.f.title}"></span>
            <input th:field="*{title}" class="field" minlength="10" maxlength="120"></label>
        <label class="block"><span class="field-label" th:text="#{listing.f.category}"></span>
            <select th:field="*{category}" class="field" id="category">
                <option value="" th:text="#{listing.f.choose}"></option>
                <optgroup th:label="#{listing.f.groupAgri}">
                    <option th:each="c : ${agriCategories}" th:value="${c}" th:text="${@statusLabels.label(c)}"
                            th:attr="data-crops=${cropsAgri.contains(c.name())}"></option></optgroup>
                <optgroup th:label="#{listing.f.groupTourism}">
                    <option th:each="c : ${tourismCategories}" th:value="${c}" th:text="${@statusLabels.label(c)}" th:attr="data-tourism=true"></option></optgroup>
            </select></label>
        <label class="block"><span class="field-label" th:text="#{listing.f.description}"></span>
            <textarea th:field="*{description}" rows="5" maxlength="3000" class="field !h-auto py-2"></textarea></label>
        <fieldset>
            <legend class="field-label"><span th:text="#{listing.f.crops}"></span> <span id="crops-req" class="text-red-700" th:text="#{listing.f.required}"></span></legend>
            <input type="hidden" name="_crops" value="on">
            <div class="flex flex-wrap gap-2">
                <label th:each="c : ${crops}" class="pf-switch !min-h-0 border rounded-lg px-3 py-1.5">
                    <input type="checkbox" name="crops" th:value="${c.code}" th:checked="${f.crops != null and f.crops.contains(c.code)}"> <span th:text="${c.name}"></span></label>
            </div>
        </fieldset>
        <div id="tourism" class="space-y-2 rounded-xl border border-orange-200 bg-orange-50 p-4">
            <p class="text-sm text-orange-900" th:text="#{listing.f.tourismNote}"></p>
            <label class="block"><span class="field-label" th:text="#{listing.f.concept}"></span>
                <textarea th:field="*{conceptLinkToAgri}" rows="3" maxlength="3000" class="field !h-auto py-2"></textarea></label>
        </div>
        <div class="flex flex-wrap gap-2 justify-end">
            <a th:href="${base} + '/addim/1'" class="btn-secondary mr-auto" th:text="#{listing.wizard.back}"></a>
            <button class="btn-secondary" th:text="#{listing.wizard.save}"></button>
            <button name="next" value="1" class="btn-primary" th:text="#{listing.wizard.saveNext}"></button>
        </div>
    </form>

    <!-- 3. Sahə məlumatları və şərtlər -->
    <form th:if="${step == 3}" th:action="${base} + '/addim/3'" th:object="${f}" method="post" enctype="multipart/form-data"
          class="card p-5 space-y-4" data-autosave="true">
        <div class="grid sm:grid-cols-3 gap-4">
            <label class="block"><span class="field-label" th:text="#{common.filter.demining}"></span>
                <select th:field="*{demining}" class="field" id="demining">
                    <option th:each="d : ${deminings}" th:value="${d}" th:text="${@statusLabels.label(d)}"></option>
                </select></label>
            <label class="block sm:col-span-2" id="cert"><span class="field-label" th:text="#{listing.f.deminingCert}"></span>
                <input type="file" name="deminingCert" accept=".pdf,.jpg,.jpeg,.png" class="text-sm">
                <span class="block text-xs text-gray-500" th:text="#{listing.f.deminingCertHint}"></span></label>
            <label class="block"><span class="field-label" th:text="#{listing.f.waterSource}"></span>
                <input th:field="*{waterSource}" class="field" maxlength="120"></label>
            <label class="block"><span class="field-label" th:text="#{listing.f.soil}"></span>
                <input th:field="*{soilType}" class="field" maxlength="80"></label>
            <label class="block"><span class="field-label" th:text="#{listing.f.roadKm}"></span>
                <input th:field="*{roadKm}" type="number" min="0" max="200" step="0.1" class="field"></label>
            <div class="flex flex-col justify-end gap-1 text-sm">
                <input type="hidden" name="_irrigation" value="on"><input type="hidden" name="_electricity" value="on">
                <label class="pf-switch !min-h-0"><input type="checkbox" name="irrigation" value="true" th:checked="*{irrigation}"> <span th:text="#{listing.f.irrigation}"></span></label>
                <label class="pf-switch !min-h-0"><input type="checkbox" name="electricity" value="true" th:checked="*{electricity}"> <span th:text="#{listing.f.electricity}"></span></label>
            </div>
            <label class="block"><span class="field-label" th:text="#{listing.f.leaseYears}"></span>
                <input th:field="*{leaseYears}" type="number" min="1" max="49" class="field"></label>
            <label class="block"><span class="field-label" th:text="#{listing.f.feePerHa}"></span>
                <input th:field="*{feePerHa}" type="number" min="0" class="field"></label>
            <label class="block"><span class="field-label" th:text="#{listing.f.investment}"></span>
                <input th:field="*{estimatedInvestment}" type="number" min="0" step="1000" class="field"></label>
            <label class="block"><span class="field-label" th:text="#{listing.f.jobs}"></span>
                <input th:field="*{expectedJobs}" type="number" min="0" max="10000" class="field"></label>
        </div>
        <ul th:unless="${files.isEmpty()}" class="text-sm">
            <li th:each="d : ${files}" th:if="${d.type.name() == 'DEMINING_CERT'}"><a th:href="@{/fayl/{id}(id=${d.id})}" target="_blank" class="text-leaf-700 underline" th:text="'✓ ' + ${d.originalName}"></a></li>
        </ul>
        <div class="flex flex-wrap gap-2 justify-end">
            <a th:href="${base} + '/addim/2'" class="btn-secondary mr-auto" th:text="#{listing.wizard.back}"></a>
            <button class="btn-secondary" th:text="#{listing.wizard.save}"></button>
            <button name="next" value="1" class="btn-primary" th:text="#{listing.wizard.saveNext}"></button>
        </div>
    </form>

    <!-- 4. Sənədlər və fotolar + summary -->
    <section th:if="${step == 4}" class="space-y-5">
        <form th:action="${base} + '/fayllar'" method="post" enctype="multipart/form-data" class="card p-5 space-y-4">
            <label class="block"><span class="field-label" th:text="#{listing.f.photos}"></span>
                <input type="file" name="photos" accept=".jpg,.jpeg,.png" multiple class="text-sm">
                <span class="block text-xs text-gray-500 mt-1" th:text="#{listing.f.photosHint}"></span></label>
            <label class="block"><span class="field-label" th:text="#{listing.f.docs}"></span>
                <input type="file" name="docs" accept=".pdf" multiple class="text-sm"></label>
            <div class="flex justify-end"><button class="btn-primary" th:text="#{listing.wizard.upload}"></button></div>
        </form>
        <div th:unless="${photos.isEmpty() and files.isEmpty()}" class="card p-5 space-y-3">
            <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">
                <figure th:each="ph, i : ${photos}" class="space-y-1">
                    <img th:src="@{/saheler/{id}/foto/{d}(id=${p.id},d=${ph.id})}" th:alt="${ph.originalName}" class="w-full aspect-square object-cover rounded-lg bg-gray-100" loading="lazy">
                    <figcaption class="flex flex-wrap items-center gap-1 text-xs">
                        <span th:if="${i.first}" class="px-1.5 rounded bg-[#2E6B3A] text-white" th:text="#{listing.cover}"></span>
                        <form th:unless="${i.first}" th:action="${base} + '/foto/' + ${ph.id} + '/yuxari'" method="post"><button class="underline" th:attr="aria-label=#{listing.moveUp}">←</button></form>
                        <form th:unless="${i.last}" th:action="${base} + '/foto/' + ${ph.id} + '/asagi'" method="post"><button class="underline" th:attr="aria-label=#{listing.moveDown}">→</button></form>
                        <form th:action="${base} + '/fayl/' + ${ph.id} + '/sil'" method="post" class="ml-auto"><button class="text-red-700 underline" th:text="#{listing.delete}"></button></form>
                    </figcaption>
                </figure>
            </div>
            <ul class="text-sm space-y-1">
                <li th:each="d : ${files}" class="flex gap-2"><a th:href="@{/fayl/{id}(id=${d.id})}" target="_blank" class="underline" th:text="${@statusLabels.label(d.type)} + ': ' + ${d.originalName}"></a>
                    <form th:action="${base} + '/fayl/' + ${d.id} + '/sil'" method="post"><button class="text-red-700 underline text-xs" th:text="#{listing.delete}"></button></form></li>
            </ul>
        </div>

        <div class="card p-5 space-y-3">
            <h2 class="font-semibold" th:text="#{listing.summary}"></h2>
            <dl class="grid sm:grid-cols-2 gap-x-6 gap-y-1 text-sm">
                <dt class="text-gray-500" th:text="#{listing.f.title}"></dt><dd th:text="${p.name} ?: '—'"></dd>
                <dt class="text-gray-500" th:text="#{listing.f.district}"></dt><dd th:text="${p.district} + (${p.village} != null ? ' · ' + ${p.village} : '')"></dd>
                <dt class="text-gray-500" th:text="#{listing.f.area}"></dt><dd th:text="${@fmt.dec(p.areaHa)} + ' ha'"></dd>
                <dt class="text-gray-500" th:text="#{listing.f.category}"></dt><dd th:text="${@statusLabels.label(p.category)}"></dd>
                <dt class="text-gray-500" th:text="#{common.filter.demining}"></dt><dd th:text="${@statusLabels.label(p.demining)}"></dd>
                <dt class="text-gray-500" th:text="#{listing.f.leaseFee}"></dt><dd th:text="${p.leaseYears} + ' · ' + ${@fmt.money(p.feePerHa)}"></dd>
                <dt class="text-gray-500" th:text="#{listing.f.photos}"></dt><dd th:text="${photos.size()}"></dd>
            </dl>
            <div th:if="${submitErrors != null}" class="p-3 rounded-lg bg-red-50 border border-red-200 text-sm" role="alert">
                <b th:text="#{listing.wizard.missingTitle}"></b>
                <ul class="list-disc ml-5 text-red-800"><li th:each="m : ${submitErrors}" th:text="${m}"></li></ul></div>
            <div th:if="${missing.isEmpty()}" class="p-3 rounded-lg bg-green-50 border border-green-200 text-sm text-green-800" th:text="#{listing.wizard.ready}"></div>
            <div th:if="${!missing.isEmpty() and submitErrors == null}" class="text-sm"><b th:text="#{listing.wizard.missingTitle}"></b>
                <ul class="list-disc ml-5 text-red-700"><li th:each="m : ${missing}" th:text="${m}"></li></ul></div>
            <div th:unless="${warnings.isEmpty()}" class="p-3 rounded-lg bg-amber-50 border border-amber-200 text-sm">
                <b th:text="#{listing.warn.title}"></b>
                <ul class="list-disc ml-5 text-amber-900"><li th:each="w : ${warnings}" th:text="${w}"></li></ul></div>
            <div class="flex flex-wrap gap-2 justify-end items-end">
                <a th:href="${base} + '/addim/3'" class="btn-secondary mr-auto" th:text="#{listing.wizard.back}"></a>
                <form th:action="${base} + '/qaralama'" method="post">
                    <button class="btn-secondary" th:text="#{listing.wizard.keepDraft}"></button></form>
                <form sec:authorize="hasRole('ADMIN')" th:action="${base} + '/derc'" method="post" class="flex flex-wrap gap-2 items-end">
                    <label class="block text-sm"><span class="field-label" th:text="#{listing.after}"></span>
                        <select name="after" class="field" id="after">
                            <option value="CATALOG" th:text="#{listing.after.CATALOG}"></option>
                            <option value="COMPETITION" th:text="#{listing.after.COMPETITION}" th:disabled="${competitions.isEmpty()}"></option>
                            <option value="AUCTION" th:text="#{listing.after.AUCTION}"></option>
                        </select></label>
                    <label class="block text-sm" id="comp-pick" hidden><span class="field-label" th:text="#{listing.after.pick}"></span>
                        <select name="competitionId" class="field">
                            <option th:each="c : ${competitions}" th:value="${c.id}" th:text="${c.code} + ' · ' + ${c.title}"></option>
                        </select></label>
                    <button class="btn-primary" th:text="#{listing.publish}"></button>
                </form>
            </div>
            <p sec:authorize="!hasRole('ADMIN')" class="text-sm text-gray-600 text-right" th:text="#{listing.publishAdminOnly}"></p>
        </div>
    </section>
</main>
<footer th:replace="~{layout :: footer}"></footer>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script th:src="@{/js/map.js}"></script>
<script th:inline="javascript">window.DISTRICT_BOXES = /*[[${districtBoxes}]]*/ {};</script>
<script th:src="@{/js/draw-polygon.js}"></script>
<script>
    // Region → district: hide districts of other regions
    const region = document.getElementById('region'), district = document.querySelector('select[name=district]');
    const syncRegion = () => district && [...district.options].forEach(o => { if (o.dataset.region) o.hidden = !!region.value && o.dataset.region !== region.value; });
    region?.addEventListener('change', () => { syncRegion(); if (district.selectedOptions[0]?.hidden) district.value = ''; });
    syncRegion();
    // Category: agrotourism concept / crops required
    const cat = document.getElementById('category'), tour = document.getElementById('tourism'), req = document.getElementById('crops-req');
    const syncCat = () => { const o = cat?.selectedOptions[0]; if (tour) tour.hidden = !o?.dataset.tourism; if (req) req.hidden = o?.dataset.crops !== 'true'; };
    cat?.addEventListener('change', syncCat); syncCat();
    // Demining certificate only when not cleared
    const dem = document.getElementById('demining'), cert = document.getElementById('cert');
    const syncDem = () => { if (cert) cert.hidden = dem.value === 'CLEARED'; };
    dem?.addEventListener('change', syncDem); dem && syncDem();
    // After publishing → competition picker
    const after = document.getElementById('after'), pick = document.getElementById('comp-pick');
    after?.addEventListener('change', () => pick.hidden = after.value !== 'COMPETITION');
    // Draft autosave: 2 s after the last change (files are uploaded only with the button)
    document.querySelectorAll('form[data-autosave=true]').forEach(form => {
        const state = document.getElementById('autosave-state');
        let timer;
        form.addEventListener('input', () => {
            clearTimeout(timer);
            timer = setTimeout(async () => {
                const body = new FormData(form);
                body.delete('deminingCert');
                const r = await fetch(form.action + '?autosave=1', { method: 'POST', body }).catch(() => null);
                if (state) state.textContent = r && r.status === 204
                    ? window.t('js.listing.saved', 'Saxlanıldı') + ' ' + new Date().toLocaleTimeString('az-AZ', { hour: '2-digit', minute: '2-digit' })
                    : window.t('js.listing.notSaved', 'Saxlanılmadı — xətaları düzəldin');
            }, 2000);
        });
    });
</script>
</body>
</html>
