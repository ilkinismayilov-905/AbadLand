<!DOCTYPE html>
<html lang="az" th:lang="${@i18n.lang()}" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 1. Commitments: progress bars + risk badge -->
<section th:fragment="commitments(v)" id="ohdelikler" class="bg-white rounded-lg shadow p-5 space-y-3" th:with="p=${v.progress}, f=${v.project}">
    <div class="flex flex-wrap items-center gap-3">
        <h2 class="font-semibold" th:text="#{apply.farm.commitments}"></h2>
        <span th:if="${p.risk.name() == 'ACTIVE'}" class="inline-block px-2 py-0.5 rounded text-xs font-medium bg-green-100 text-green-800" th:text="#{apply.farm.onPlan}"></span>
        <span th:if="${p.risk.name() == 'AT_RISK'}" class="inline-block px-2 py-0.5 rounded text-xs font-medium bg-red-100 text-red-800" th:text="#{apply.farm.atRisk}"></span>
        <span class="ml-auto text-xs text-gray-500" th:text="#{apply.farm.startLine(${@fmt.date(f.startDate)}, ${'' + f.committedMonths})}"></span>
    </div>
    <ul th:unless="${p.riskReasons.isEmpty()}" class="text-sm text-red-700 list-disc ml-5">
        <li th:each="r : ${p.riskReasons}" th:text="${r}"></li>
    </ul>
    <div class="grid sm:grid-cols-2 gap-4 text-sm">
        <div th:each="b : ${ {
                {#messages.msg('apply.farm.barInvestment'), p.investmentPct, @fmt.money(p.investedToDate) + ' / ' + @fmt.money(f.committedInvestment)},
                {#messages.msg('apply.farm.barJobs'), p.jobsPct, #messages.msg('apply.farm.personsOf', '' + p.workers, '' + f.committedJobs)},
                {#messages.msg('apply.farm.barTime'), p.timePct, #messages.msg('apply.farm.timeOf', '' + f.committedMonths)},
                {#messages.msg('apply.farm.barLocal'), p.localPct, #messages.msg('apply.farm.personsOf', '' + p.localWorkers, '' + p.workers)} } }">
            <div class="flex justify-between"><span th:text="${b[0]}"></span><span><b th:text="${b[1]} + '%'"></b> <span class="text-gray-500" th:text="${b[2]}"></span></span></div>
            <div class="h-2.5 rounded bg-gray-100"><div class="h-2.5 rounded" th:classappend="${bStat.index == 2} ? 'bg-gray-400' : 'bg-leaf-500'"
                                                        th:style="'width:' + ${b[1] > 100 ? 100 : b[1]} + '%'"></div></div>
        </div>
    </div>
</section>

<!-- 2. Crop plan -->
<section th:fragment="plan(v, editable, crops)" id="plan" class="bg-white rounded-lg shadow p-5 space-y-3">
    <h2 class="font-semibold" th:text="#{apply.farm.plan}"></h2>
    <table th:unless="${v.plan.isEmpty()}" class="w-full text-sm">
        <tr class="text-left text-gray-500"><th class="py-1" th:text="#{apply.farm.colCrop}"></th><th th:text="#{apply.farm.colArea}"></th><th th:text="#{apply.farm.colSeason}"></th><th th:text="#{apply.farm.colTasks}"></th></tr>
        <tr th:each="i : ${v.plan}" class="border-t">
            <td class="py-2 font-medium" th:text="${i.crop.name}"></td>
            <td th:text="${@fmt.dec(i.areaHa)} + ' ' + #{apply.unit.ha}"></td>
            <td th:text="${i.seasonYear}"></td>
            <td th:text="${v.tasksByItem[i.id].size()}"></td>
        </tr>
        <tr class="border-t font-semibold"><td class="py-2" th:text="#{apply.farm.total}"></td>
            <td colspan="3" th:text="${@fmt.dec(v.plannedArea)} + ' / ' + ${@fmt.dec(v.project.plot.areaHa)} + ' ' + #{apply.unit.ha}"></td></tr>
    </table>
    <p th:if="${v.plan.isEmpty()}" class="text-sm text-gray-500" th:text="#{apply.farm.noPlan}"></p>
    <form th:if="${editable and v.freeArea() > 0}" th:action="@{/kabinet/teserrufat/{id}/plan(id=${v.project.id})}" method="post"
          class="flex flex-wrap gap-3 items-end text-sm border-t pt-3">
        <label>[[#{apply.farm.colCrop}]]
            <select name="crop" class="block mt-1 border rounded px-2 py-1.5">
                <option th:each="c : ${crops}" th:value="${c.code}" th:text="${c.name}"
                        th:selected="${v.plan.isEmpty() and v.project.application != null and c.code == v.project.application.plannedCrop}"></option>
            </select></label>
        <label>[[#{apply.farm.areaHa}]] <span class="text-gray-500" th:text="#{apply.farm.free(${@fmt.dec(v.freeArea())})}"></span>
            <input name="areaHa" type="number" step="0.1" min="0.1" th:max="${v.freeArea()}" th:value="${v.freeArea()}" required class="block mt-1 w-28 border rounded px-2 py-1.5"></label>
        <label>[[#{apply.farm.seasonYear}]]
            <input name="seasonYear" type="number" th:value="${today.year}" required class="block mt-1 w-24 border rounded px-2 py-1.5"></label>
        <button class="px-4 py-1.5 rounded bg-leaf-600 text-white hover:bg-leaf-700" th:text="#{apply.farm.addPlan}"></button>
    </form>
</section>

<!-- 3. Planting calendar: per crop a 12-month timeline + task list -->
<section th:fragment="calendar(v, editable, today)" id="teqvim" class="bg-white rounded-lg shadow p-5 space-y-5">
    <div class="flex flex-wrap items-center gap-3">
        <h2 class="font-semibold" th:text="#{apply.farm.calendar}"></h2>
        <span class="text-xs text-gray-500">
            <span class="inline-block w-3 h-3 rounded bg-blue-300 align-middle"></span> [[#{apply.farm.legendPlanned}]] ·
            <span class="inline-block w-3 h-3 rounded bg-green-500 align-middle"></span> [[#{apply.farm.legendDone}]] ·
            <span class="inline-block w-3 h-3 rounded bg-red-500 align-middle"></span> [[#{apply.farm.legendDelayed}]]</span>
        <span class="ml-auto text-xs px-2 py-0.5 rounded bg-yellow-100 text-yellow-800" th:text="#{apply.farm.calendarTestValue}"></span>
    </div>
    <p th:if="${v.plan.isEmpty()}" class="text-sm text-gray-500" th:text="#{apply.farm.calendarEmpty}"></p>
    <div th:each="i : ${v.plan}" class="space-y-2">
        <h3 class="text-sm font-semibold" th:text="${i.crop.name} + ' · ' + ${@fmt.dec(i.areaHa)} + ' ' + #{apply.unit.ha} + ' · ' + ${i.seasonYear}"></h3>
        <div class="overflow-x-auto">
            <div class="min-w-[640px] text-xs">
                <!-- one grid per row: label column + 12 month columns (auto-placement would mix rows) -->
                <div class="grid" style="grid-template-columns: 9rem repeat(12, minmax(0, 1fr))">
                    <div></div>
                    <div th:each="m : ${#strings.arraySplit(#messages.msg('apply.farm.months'), ',')}"
                         class="text-center text-gray-500 border-l" th:text="${m}"></div>
                </div>
                <div th:each="t : ${v.tasksByItem[i.id]}" class="grid items-center py-0.5 border-t border-gray-100"
                     style="grid-template-columns: 9rem repeat(12, minmax(0, 1fr))">
                        <div class="pr-2 truncate" style="grid-column: 1" th:title="${@statusLabels.label(t.stage)}"
                             th:text="${@statusLabels.label(t.stage)} + ' ' + ${t.plannedStart.year}"></div>
                        <div class="h-6 rounded flex items-center px-1.5 text-white font-medium"
                             th:classappend="${t.status.name() == 'DONE'} ? 'bg-green-500' : (${t.status.name() == 'DELAYED'} ? 'bg-red-500' : 'bg-blue-300 text-blue-900')"
                             th:style="'grid-column:' + ${t.plannedStart.monthValue + 1} + ' / ' + ${t.plannedEnd.year > t.plannedStart.year ? 14 : t.plannedEnd.monthValue + 2}"
                             th:title="${@fmt.date(t.plannedStart)} + ' – ' + ${@fmt.date(t.plannedEnd)} + ' · ' + ${@statusLabels.label(t.status)}"
                             th:text="${t.status.name() == 'DONE'} ? '✓' : (${t.status.name() == 'DELAYED'} ? '!' : '')"></div>
                </div>
            </div>
        </div>
    </div>
    <div th:unless="${v.plan.isEmpty()}">
        <h3 class="text-sm font-semibold mb-2" th:text="#{apply.farm.colTasks}"></h3>
        <div class="overflow-x-auto">
        <table class="w-full text-sm min-w-[640px]">
            <tr class="text-left text-gray-500"><th class="py-1" th:text="#{apply.farm.colCrop}"></th><th th:text="#{apply.farm.colStage}"></th><th th:text="#{apply.farm.colPlan}"></th><th th:text="#{apply.farm.colStatus}"></th><th th:text="#{apply.farm.colActual}"></th><th></th></tr>
            <th:block th:each="i : ${v.plan}">
                <th:block th:each="t : ${v.tasksByItem[i.id]}">
                    <tr class="border-t align-top" th:classappend="${t.status.name() == 'DELAYED'} ? 'bg-red-50'">
                        <td class="py-2" th:text="${i.crop.name}"></td>
                        <td th:text="${@statusLabels.label(t.stage)}"></td>
                        <td class="whitespace-nowrap" th:text="${@fmt.date(t.plannedStart)} + ' – ' + ${@fmt.date(t.plannedEnd)}"></td>
                        <td><span th:class="${@statusLabels.badge(t.status)}" th:text="${@statusLabels.label(t.status)}"></span></td>
                        <td><span th:text="${@fmt.date(t.actualDate)}"></span>
                            <div th:if="${t.note != null}" class="text-xs text-gray-500" th:text="${t.note}"></div></td>
                        <td class="py-1">
                            <form th:if="${editable and t.status.name() != 'DONE' and !t.plannedStart.isAfter(today)}" th:action="@{/kabinet/teserrufat/{id}/tapsiriq/{tid}(id=${v.project.id},tid=${t.id})}"
                                  method="post" class="flex flex-wrap gap-1 justify-end">
                                <input type="date" name="date" th:value="${today}" th:max="${today}" required class="border rounded px-1 py-0.5 text-xs" th:attr="aria-label=#{apply.farm.actualDate}">
                                <input name="note" maxlength="500" th:placeholder="#{apply.farm.note}" class="border rounded px-1 py-0.5 text-xs w-28" th:attr="aria-label=#{apply.farm.note}">
                                <button class="px-2 py-0.5 rounded bg-green-600 text-white text-xs hover:bg-green-700" th:text="#{apply.farm.markDone}"></button>
                            </form>
                        </td>
                    </tr>
                </th:block>
            </th:block>
        </table>
        </div>
    </div>
</section>

<!-- 4. Workforce -->
<section th:fragment="workforce(v, editable, roles)" id="heyet" class="bg-white rounded-lg shadow p-5 space-y-3">
    <h2 class="font-semibold" th:text="#{apply.farm.workforce}"></h2>
    <table th:unless="${v.workforce.isEmpty()}" class="w-full text-sm">
        <tr class="text-left text-gray-500"><th class="py-1" th:text="#{apply.farm.colRole}"></th><th th:text="#{apply.farm.colCount}"></th><th th:text="#{apply.farm.colLocal}"></th></tr>
        <tr th:each="w : ${v.workforce}" class="border-t">
            <td class="py-2" th:text="${@statusLabels.label(w.role)}"></td>
            <td th:text="${w.count}"></td>
            <td th:text="${w.local} ? #{apply.farm.yes} : #{apply.farm.no}"></td>
        </tr>
        <tr class="border-t font-semibold"><td class="py-2" th:text="#{apply.farm.totalPromised}"></td>
            <td colspan="2" th:text="#{apply.farm.workforceTotal(${'' + v.progress.workers}, ${'' + v.project.committedJobs}, ${'' + v.progress.localWorkers})}"></td></tr>
    </table>
    <p th:if="${v.workforce.isEmpty()}" class="text-sm text-gray-500" th:text="#{apply.farm.noWorkers(${'' + v.project.committedJobs})}"></p>
    <form th:if="${editable}" th:action="@{/kabinet/teserrufat/{id}/isci(id=${v.project.id})}" method="post"
          class="flex flex-wrap gap-3 items-end text-sm border-t pt-3">
        <label>[[#{apply.farm.colRole}]]
            <select name="role" class="block mt-1 border rounded px-2 py-1.5">
                <option th:each="r : ${roles}" th:value="${r}" th:text="${@statusLabels.label(r)}" th:selected="${r.name() == 'WORKER'}"></option>
            </select></label>
        <label>[[#{apply.farm.colCount}]] <input name="count" type="number" min="1" max="1000" value="1" required class="block mt-1 w-20 border rounded px-2 py-1.5"></label>
        <label class="flex items-center gap-2 pb-2"><input type="checkbox" name="local" value="true" checked> [[#{apply.farm.localResident}]]</label>
        <button class="px-4 py-1.5 rounded bg-leaf-600 text-white hover:bg-leaf-700" th:text="#{apply.farm.add}"></button>
    </form>
</section>

<!-- 5. Quarterly reports (staff review when staff=true) -->
<section th:fragment="reports(v, editable, staff)" id="hesabat" class="bg-white rounded-lg shadow p-5 space-y-3">
    <h2 class="font-semibold" th:text="#{apply.farm.reports}"></h2>
    <form th:if="${editable}" th:action="@{/kabinet/teserrufat/{id}/hesabat(id=${v.project.id})}" method="post" enctype="multipart/form-data"
          class="grid sm:grid-cols-3 gap-3 text-sm border-b pb-4">
        <label>[[#{apply.farm.period}]] <input name="period" required pattern="20\d{2}-Q[1-4]" placeholder="2026-Q4"
                           th:value="${today.year} + '-Q' + ${(today.monthValue + 2) / 3}"
                           class="block mt-1 w-full border rounded px-2 py-1.5"></label>
        <label>[[#{apply.farm.investedToDate}]] <input name="investedToDate" type="number" min="0" required class="block mt-1 w-full border rounded px-2 py-1.5"></label>
        <label>[[#{apply.farm.photos}]] <input name="photos" type="file" multiple accept=".jpg,.jpeg,.png" class="block mt-1 text-xs"></label>
        <label class="sm:col-span-3">[[#{apply.farm.note}]] <textarea name="note" rows="2" maxlength="2000" class="block mt-1 w-full border rounded px-2 py-1.5"></textarea></label>
        <div class="sm:col-span-3"><button class="px-4 py-1.5 rounded bg-leaf-600 text-white hover:bg-leaf-700" th:text="#{apply.farm.sendReport}"></button></div>
    </form>
    <p th:if="${v.reports.isEmpty()}" class="text-sm text-gray-500" th:text="#{apply.farm.noReports}"></p>
    <div th:each="r : ${v.reports}" class="border rounded p-3 text-sm space-y-1">
        <div class="flex flex-wrap items-center gap-2">
            <b th:text="${r.period}"></b>
            <span th:class="${@statusLabels.badge(r.status)}" th:text="${@statusLabels.label(r.status)}"></span>
            <span th:text="${@fmt.money(r.investedToDate)}"></span>
            <span class="ml-auto text-xs text-gray-500" th:text="${@fmt.dateTime(r.submittedAt)}"></span>
        </div>
        <p th:if="${r.note != null}" class="text-gray-700" th:text="${r.note}"></p>
        <div th:unless="${v.photos[r.id].isEmpty()}" class="flex flex-wrap gap-2">
            <a th:each="d : ${v.photos[r.id]}" th:href="@{/fayl/{id}(id=${d.id})}" target="_blank" class="text-leaf-700 underline text-xs" th:text="${d.originalName}"></a>
        </div>
        <p th:if="${r.reviewerComment != null}" class="text-xs text-orange-800" th:text="#{apply.farm.operatorComment(${r.reviewerComment})}"></p>
        <div th:if="${staff and r.status.name() == 'SUBMITTED'}" class="flex flex-wrap gap-2 pt-1">
            <form th:action="@{/idare/monitorinq/{id}/hesabat/{rid}(id=${v.project.id},rid=${r.id})}" method="post">
                <input type="hidden" name="accept" value="true">
                <button class="px-3 py-1 rounded bg-green-600 text-white text-xs hover:bg-green-700" th:text="#{apply.farm.accept}"></button>
            </form>
            <form th:action="@{/idare/monitorinq/{id}/hesabat/{rid}(id=${v.project.id},rid=${r.id})}" method="post" class="flex gap-1 flex-1 min-w-[240px]">
                <input name="comment" required maxlength="1000" th:placeholder="#{apply.farm.fixPlaceholder}" class="flex-1 border rounded px-2 py-1 text-xs" th:attr="aria-label=#{apply.farm.fixAria}">
                <button class="px-3 py-1 rounded bg-orange-600 text-white text-xs hover:bg-orange-700" th:text="#{apply.farm.requestFix}"></button>
            </form>
        </div>
    </div>
</section>

</body>
</html>
