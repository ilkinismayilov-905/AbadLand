<!DOCTYPE html>
<html lang="az" th:lang="${@i18n.lang()}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head(#{staff.comps.pageTitle})}"></head>
<body class="bg-gray-50 text-gray-900">
<header th:replace="~{layout :: header}"></header>
<div th:replace="~{layout :: flash}"></div>
<main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
    <nav th:replace="~{app-fragments :: staffNav('comps')}"></nav>
    <h1 class="text-2xl font-bold" th:text="#{staff.comps.title}"></h1>

    <details sec:authorize="hasAnyRole('OPERATOR','ADMIN')" class="bg-white rounded-lg shadow p-5" th:attr="open=${openForm} ? 'open' : null">
        <summary class="cursor-pointer font-semibold text-leaf-700" th:text="#{staff.comps.new}"></summary>
        <form th:action="@{/idare/musabiqeler}" th:object="${form}" method="post" class="mt-4 space-y-4">
            <label class="block"><span class="text-sm font-medium" th:text="#{staff.comps.fieldTitle}"></span>
                <input th:field="*{title}" maxlength="200" class="mt-1 w-full border rounded px-3 py-2">
                <span class="text-sm text-red-600" th:errors="*{title}"></span></label>
            <label class="block"><span class="text-sm font-medium" th:text="#{staff.comps.requirements}"></span>
                <textarea th:field="*{requirements}" rows="3" maxlength="3000" class="mt-1 w-full border rounded px-3 py-2"></textarea>
                <span class="text-sm text-red-600" th:errors="*{requirements}"></span></label>
            <div class="grid sm:grid-cols-2 gap-4">
                <label class="block"><span class="text-sm font-medium" th:text="#{staff.comps.minInvestment}"></span>
                    <input th:field="*{minInvestment}" type="number" min="1" class="mt-1 w-full border rounded px-3 py-2">
                    <span class="text-sm text-red-600" th:errors="*{minInvestment}"></span></label>
                <label class="block"><span class="text-sm font-medium" th:text="#{staff.comps.deadline}"></span>
                    <input th:field="*{deadline}" type="date" class="mt-1 w-full border rounded px-3 py-2">
                    <span class="text-sm text-red-600" th:errors="*{deadline}"></span></label>
            </div>
            <fieldset>
                <legend class="text-sm font-medium" th:text="#{staff.comps.plots}"></legend>
                <div class="grid sm:grid-cols-2 md:grid-cols-3 gap-2 mt-2 text-sm">
                    <label th:each="p : ${freePlots}" class="flex gap-2 items-center border rounded px-2 py-1.5">
                        <input type="checkbox" name="plotIds" th:value="${p.id}" th:checked="${form.plotIds.contains(p.id)}">
                        <span th:text="#{staff.comps.plotOption(${p.code}, ${p.district}, ${@fmt.dec(p.areaHa)})}"></span></label>
                </div>
                <span class="text-sm text-red-600" th:errors="*{plotIds}"></span>
            </fieldset>
            <button class="px-5 py-2 rounded bg-leaf-600 text-white font-semibold hover:bg-leaf-700" th:text="#{staff.comps.create}"></button>
        </form>
    </details>

    <div class="bg-white rounded-lg shadow overflow-x-auto">
        <table class="w-full text-sm">
            <tr class="text-left text-gray-500 bg-earth-50"><th class="p-3" th:text="#{staff.col.code}"></th><th th:text="#{staff.col.title}"></th><th th:text="#{staff.col.plots}"></th><th class="text-right" th:text="#{staff.col.minimum}"></th>
                <th class="pl-4" th:text="#{staff.col.deadline}"></th><th th:text="#{staff.col.status}"></th><th th:text="#{staff.col.createdBy}"></th><th class="w-72"></th></tr>
            <tr th:each="c : ${competitions}" class="border-t align-top">
                <td class="p-3 font-medium" th:text="${c.code}"></td>
                <td th:text="${c.title}"></td>
                <td class="text-xs" th:text="${#strings.listJoin(c.plots.![code], ', ')}"></td>
                <td class="text-right" th:text="${@fmt.money(c.minInvestment)}"></td>
                <td class="pl-4" th:text="${@fmt.date(c.deadline)}"></td>
                <td><span th:class="${@statusLabels.badge(c.status)}" th:text="${@statusLabels.label(c.status)}"></span>
                    <div th:if="${c.comment != null}" class="text-xs text-gray-600 mt-1" th:text="${c.comment}"></div></td>
                <td class="text-xs" th:text="${c.createdBy != null} ? ${c.createdBy.fullName} : '—'"></td>
                <td class="py-2 pr-3">
                    <div sec:authorize="hasAnyRole('COMMISSION','ADMIN')" th:if="${c.status.name() == 'PENDING_APPROVAL'}" class="space-y-2">
                        <form th:action="@{/idare/musabiqeler/{id}/tesdiq(id=${c.id})}" method="post">
                            <button class="px-3 py-1 rounded bg-green-600 text-white text-xs hover:bg-green-700" th:text="#{staff.comps.approve}"></button></form>
                        <form th:action="@{/idare/musabiqeler/{id}/redd(id=${c.id})}" method="post" class="flex gap-1">
                            <input name="comment" required th:placeholder="#{staff.comps.rejectReason}" class="flex-1 border rounded px-2 py-1 text-xs">
                            <button class="px-3 py-1 rounded bg-red-600 text-white text-xs hover:bg-red-700" th:text="#{staff.comps.reject}"></button></form>
                    </div>
                </td>
            </tr>
        </table>
    </div>
</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
