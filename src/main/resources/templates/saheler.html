<!DOCTYPE html>
<html lang="az" th:lang="${@i18n.lang()}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(#{plots.catalog.title})}"></head>
<body class="bg-gray-50 text-gray-900">
<header th:replace="~{layout :: header}"></header>
<div th:replace="~{layout :: flash}"></div>
<main class="max-w-7xl mx-auto px-4 py-6 space-y-4">
    <h1 class="text-2xl font-bold" th:text="#{plots.catalog.heading}"></h1>
    <div th:replace="~{layout :: plotFilter('/saheler', false)}"></div>
    <p th:if="${filter.fruit != null and !filter.fruit.isEmpty()}" class="text-sm text-gray-600">
        [[#{plots.catalog.fruitNote}]]<span th:if="${filter.sort == null or filter.sort.isEmpty()}" th:text="#{plots.catalog.sortedByScore}"></span>.</p>
    <form th:action="@{/muqayise}" method="get" id="compareForm">
        <div class="flex flex-wrap items-center gap-3 mb-3">
            <span class="font-medium" aria-live="polite" th:text="#{plots.catalog.found(${cards.size()})}"></span>
            <button th:unless="${cards.isEmpty()}" class="ml-auto btn-secondary text-sm !min-h-[40px]" th:text="#{plots.catalog.compareSelected}"></button>
        </div>
        <div th:if="${cards.isEmpty()}" class="card p-8 text-center text-gray-600">
            <img th:replace="~{layout :: emptyIcon}">
            <p th:text="#{plots.catalog.empty}"></p>
            <a th:href="@{/saheler}" class="btn-primary mt-4" th:text="#{plots.catalog.resetFilters}"></a>
        </div>
        <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <div th:each="c : ${cards}" class="card p-4 flex flex-col gap-2">
                <a th:if="${covers.containsKey(c.plot.id)}" th:href="@{/saheler/{id}(id=${c.plot.id})}" class="-mx-4 -mt-4 mb-1 block" tabindex="-1">
                    <img th:src="@{/saheler/{id}/foto/{d}(id=${c.plot.id},d=${covers.get(c.plot.id)})}" alt="" class="w-full h-40 object-cover rounded-t-[inherit]" loading="lazy"></a>
                <div class="flex items-start justify-between gap-2">
                    <div>
                        <div class="text-xs text-gray-500"><span th:text="${c.plot.code}"></span>
                            <span th:if="${c.plot.recent}" class="ml-1 px-1.5 py-0.5 rounded bg-[#2E6B3A] text-white font-semibold" th:text="#{listing.newBadge}"></span></div>
                        <a th:href="@{/saheler/{id}(id=${c.plot.id})}" class="font-semibold text-lg hover:underline" th:text="${c.plot.name}"></a>
                        <div class="text-sm text-gray-600" th:text="${c.plot.district} + ' · ' + #{plots.ha(${@fmt.dec(c.plot.areaHa)})}"></div>
                    </div>
                    <span th:if="${c.fruitScore != null}" class="text-2xl font-bold text-leaf-700" th:text="${c.fruitScore} + '%'"></span>
                </div>
                <div class="flex flex-wrap gap-1">
                    <span th:class="${@statusLabels.badge(c.plot.purpose)}" th:text="${@statusLabels.label(c.plot.purpose)}"></span>
                    <span th:class="${@statusLabels.badge(c.plot.demining)}" th:text="${@statusLabels.label(c.plot.demining)}"></span>
                </div>
                <span th:replace="~{layout :: suitChips(${c.top3()})}"></span>
                <div class="text-sm mt-auto pt-2 border-t">
                    <span th:if="${c.competition == null}" class="text-gray-500" th:text="#{plots.catalog.noCompetition}"></span>
                    <span th:if="${c.competition != null}">
                        <span th:text="${c.competition.code}"></span> ·
                        <span th:class="${c.daysLeft <= 7} ? 'text-red-600 font-semibold' : 'text-gray-700'" th:text="#{plots.daysLeft(${c.daysLeft})}"></span>
                    </span>
                </div>
                <label class="text-sm flex items-center gap-2"><input type="checkbox" name="ids" th:value="${c.plot.id}"> [[#{plots.catalog.addToCompare}]]</label>
            </div>
        </div>
    </form>
</main>
<footer th:replace="~{layout :: footer}"></footer>
<script th:src="@{/js/filters.js}"></script>
<script th:inline="javascript">
    document.getElementById('compareForm').addEventListener('submit', e => {
        const n = document.querySelectorAll('input[name=ids]:checked').length;
        if (n < 2 || n > 3) { e.preventDefault(); alert(/*[[#{plots.compare.pick}]]*/ ''); }
    });
</script>
</body>
</html>
