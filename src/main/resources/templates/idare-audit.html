<!DOCTYPE html>
<html lang="az" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Audit')}"></head>
<body class="bg-gray-50 text-gray-900">
<header th:replace="~{layout :: header}"></header>
<main class="max-w-7xl mx-auto px-4 py-6 space-y-4">
    <nav th:replace="~{app-fragments :: staffNav('audit')}"></nav>
    <h1 class="text-2xl font-bold">Audit jurnalı <span class="text-sm font-normal text-gray-500">(son 200)</span></h1>
    <div class="bg-white rounded-lg shadow overflow-x-auto">
        <table class="w-full text-sm">
            <tr class="text-left text-gray-500 bg-earth-50"><th class="p-2">Vaxt</th><th>İstifadəçi</th><th>Rol</th><th>Əməliyyat</th><th>Obyekt</th><th>Təfərrüat</th><th>IP</th></tr>
            <tr th:each="a : ${entries}" class="border-t align-top">
                <td class="p-2 whitespace-nowrap" th:text="${@fmt.dateTime(a.at)}"></td>
                <td th:text="${a.actorEmail}"></td>
                <td th:text="${a.actorRole}"></td>
                <td class="font-mono text-xs" th:text="${a.action}"></td>
                <td th:text="${a.entity} + (${a.entityId != null} ? ' ' + ${a.entityId} : '')"></td>
                <td class="text-gray-700" th:text="${a.details}"></td>
                <td class="text-gray-500" th:text="${a.ip}"></td>
            </tr>
        </table>
    </div>
</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
