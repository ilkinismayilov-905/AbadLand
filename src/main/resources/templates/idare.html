<!DOCTYPE html>
<html lang="az" th:lang="${@i18n.lang()}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head(#{staff.dashboard.title})}"></head>
<body class="bg-gray-50 text-gray-900">
<header th:replace="~{layout :: header}"></header>
<div th:replace="~{layout :: flash}"></div>
<main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
    <nav th:replace="~{app-fragments :: staffNav('dashboard')}"></nav>
    <div class="flex flex-wrap items-center gap-3">
        <h1 class="text-2xl font-bold" th:text="#{staff.dashboard.heading}">Dashboard</h1>
        <form sec:authorize="hasRole('ADMIN')" th:action="@{/idare/iqlim-yenile}" method="post" class="ml-auto" th:attr="data-busy=#{staff.dashboard.refreshing}"
              onsubmit="const b=this.querySelector('button');b.disabled=true;b.textContent=this.dataset.busy;">
            <button class="px-3 py-1.5 rounded border bg-white text-sm hover:bg-gray-50" th:text="#{staff.dashboard.refreshClimate}"></button>
        </form>
    </div>
    <section class="grid grid-cols-2 md:grid-cols-5 gap-4">
        <div class="bg-white rounded-lg shadow p-4"><div class="text-2xl font-bold text-leaf-700" th:text="${d.totalApplications}"></div><div class="text-sm text-gray-600" th:text="#{staff.dashboard.totalApplications}"></div></div>
        <div class="bg-white rounded-lg shadow p-4"><div class="text-2xl font-bold text-leaf-700" th:text="${@fmt.money(d.totalInvestment)}"></div><div class="text-sm text-gray-600" th:text="#{staff.dashboard.totalInvestment}"></div></div>
        <div class="bg-white rounded-lg shadow p-4"><div class="text-2xl font-bold text-leaf-700" th:text="${@fmt.num(d.expectedJobs)}"></div><div class="text-sm text-gray-600" th:text="#{staff.dashboard.expectedJobs}"></div></div>
        <div class="bg-white rounded-lg shadow p-4"><div class="text-2xl font-bold text-leaf-700" th:text="${d.approved}"></div><div class="text-sm text-gray-600">[[#{staff.dashboard.approved}]]</div></div>
        <div class="bg-white rounded-lg shadow p-4"><div class="text-2xl font-bold text-leaf-700" th:text="${d.publishedCompetitions}"></div><div class="text-sm text-gray-600" th:text="#{staff.dashboard.publishedCompetitions}"></div></div>
    </section>
    <section class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <a th:href="@{/idare/monitorinq}" class="bg-white rounded-lg shadow p-4 hover:bg-leaf-50"><div class="text-2xl font-bold text-leaf-700" th:text="${farmTotals.activeProjects}"></div><div class="text-sm text-gray-600" th:text="#{staff.dashboard.activeFarms}"></div></a>
        <a th:href="@{/idare/monitorinq}" class="bg-white rounded-lg shadow p-4 hover:bg-leaf-50"><div class="text-2xl font-bold text-leaf-700" th:text="${farmTotals.actualJobs} + ' / ' + ${farmTotals.promisedJobs}"></div><div class="text-sm text-gray-600" th:text="#{staff.dashboard.actualJobs}"></div></a>
        <a th:href="@{/idare/monitorinq}" class="bg-white rounded-lg shadow p-4 hover:bg-leaf-50"><div class="text-2xl font-bold" th:classappend="${farmTotals.delayedTasks > 0} ? 'text-red-600' : 'text-leaf-700'" th:text="${farmTotals.delayedTasks}"></div><div class="text-sm text-gray-600" th:text="#{staff.dashboard.delayedTasks}"></div></a>
    </section>
    <section class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <a th:href="@{/idare/herraclar}" class="bg-white rounded-lg shadow p-4 hover:bg-leaf-50"><div class="text-2xl font-bold text-leaf-700" th:text="${auctionKpis[0]}"></div><div class="text-sm text-gray-600" th:text="#{staff.dashboard.activeAuctions}"></div></a>
        <a th:href="@{/idare/herraclar}" class="bg-white rounded-lg shadow p-4 hover:bg-leaf-50"><div class="text-2xl font-bold text-leaf-700" th:text="'+' + ${auctionKpis[1]} + '%'"></div><div class="text-sm text-gray-600" th:text="#{staff.dashboard.auctionGrowth}"></div></a>
    </section>
    <div class="grid lg:grid-cols-3 gap-6">
        <section class="bg-white rounded-lg shadow p-5">
            <h2 class="font-semibold mb-3" th:text="#{staff.dashboard.byStatus}"></h2>
            <ul class="space-y-2 text-sm">
                <li th:each="e : ${d.byStatus}" class="flex justify-between items-center">
                    <a th:href="@{/idare/muracietler(status=${e.key})}" th:class="${@statusLabels.badge(e.key)}" th:text="${@statusLabels.label(e.key)}"></a>
                    <b th:text="${e.value}"></b></li>
            </ul>
        </section>
        <section class="lg:col-span-2 bg-white rounded-lg shadow p-5">
            <h2 class="font-semibold mb-3" th:text="#{staff.dashboard.byDistrict}"></h2>
            <table class="w-full text-sm">
                <tr class="text-left text-gray-500"><th class="py-1 w-28" th:text="#{staff.col.district}"></th><th class="w-20" th:text="#{staff.col.application}"></th><th class="w-36 text-right pr-3" th:text="#{staff.col.investment}"></th><th></th></tr>
                <tr th:each="r : ${d.byDistrict}" class="border-t">
                    <td class="py-2" th:text="${r.district}"></td>
                    <td th:text="${r.applications}"></td>
                    <td class="text-right pr-3" th:text="${@fmt.money(r.investment)}"></td>
                    <td><div class="h-3 rounded bg-leaf-500" th:style="'width:' + ${r.barPercent} + '%'"></div></td>
                </tr>
            </table>
        </section>
    </div>
</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
