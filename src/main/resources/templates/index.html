<!DOCTYPE html>
<html lang="az" th:lang="${@i18n.lang()}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(#{common.home.title})}"></head>
<body class="bg-gray-50 text-gray-900">
<header th:replace="~{layout :: header}"></header>
<div th:replace="~{layout :: flash}"></div>
<main th:with="h=${home}">

    <!-- 1. Hero -->
    <section class="bg-gradient-to-br from-[#eef6ea] via-white to-[#faf6f0] border-b border-[#DDE3DC]">
        <div class="max-w-7xl mx-auto px-4 py-12 md:py-20 grid lg:grid-cols-2 gap-10 items-center">
            <div>
                <span class="inline-block text-xs font-semibold uppercase tracking-wider text-[#2E6B3A] bg-[#e3f0de] rounded-full px-3 py-1" th:text="#{common.home.badge}"></span>
                <h1 class="mt-4 text-3xl sm:text-4xl lg:text-5xl font-bold leading-tight text-[#1F2933]" th:text="#{common.home.heading}"></h1>
                <p class="mt-4 text-lg text-gray-600 max-w-xl" th:text="#{common.home.lead}"></p>
                <div class="mt-8 flex flex-col sm:flex-row gap-3">
                    <a th:href="@{/uygunluq}" class="btn-primary text-base px-6" th:text="#{common.home.startQuiz}"></a>
                    <a th:href="@{/xerite}" class="btn-secondary text-base px-6" th:text="#{common.home.viewMap}"></a>
                </div>
            </div>
            <!-- Visual: hero photo (LCP, no lazy loading) or the SVG fallback + a real sample plot card -->
            <div class="relative mx-auto w-full max-w-xl lg:max-w-none mb-16 lg:mb-0">
                <div th:if="${heroPhoto}" class="hero-photo">
                    <picture>
                        <source type="image/webp" th:srcset="@{/img/hero-800.webp} + ' 800w, ' + @{/img/hero-1200.webp} + ' 1200w, ' + @{/img/hero-1448.webp} + ' 1448w'"
                                sizes="(min-width: 1280px) 600px, (min-width: 1024px) 50vw, 100vw">
                        <img th:src="@{/img/hero-1200.jpg}" width="1448" height="1086" fetchpriority="high" decoding="async"
                             th:alt="#{common.home.heroAlt}">
                    </picture>
                </div>
                <svg th:unless="${heroPhoto}" viewBox="0 0 400 300" class="w-full rounded-2xl shadow-lg" aria-hidden="true">
                    <rect width="400" height="300" fill="#cfe5c4"/>
                    <path d="M0 210 Q100 170 200 190 T400 160 V300 H0Z" fill="#a9cf98"/>
                    <path d="M0 240 Q120 205 220 225 T400 200 V300 H0Z" fill="#8bbd76"/>
                    <g stroke="#6fa65a" stroke-width="5" stroke-linecap="round" opacity=".8">
                        <path d="M10 270 L170 205"/><path d="M60 290 L220 215"/><path d="M120 300 L280 220"/><path d="M190 300 L340 215"/><path d="M260 300 L395 225"/>
                    </g>
                    <path d="M0 140 Q80 80 160 120 T300 90 T400 110 V170 Q300 150 200 175 T0 190Z" fill="#b8a37f" opacity=".55"/>
                    <circle cx="330" cy="55" r="26" fill="#f6d77a"/>
                </svg>
                <th:block th:if="${h.sample != null}"><div th:with="c=${h.sample}" class="hero-float">
                <div class="card p-4">
                    <div class="flex items-center justify-between gap-2">
                        <div class="min-w-0">
                            <div class="text-xs text-gray-500" th:text="${c.plot.code} + ' · ' + ${c.plot.district}"></div>
                            <div class="font-semibold truncate" th:text="${c.plot.name}"></div>
                        </div>
                        <div th:unless="${c.suitability.isEmpty()}" class="shrink-0 w-14 h-14 rounded-full bg-[#2E6B3A] text-white flex flex-col items-center justify-center">
                            <b th:text="${c.suitability[0].score} + '%'"></b><span class="text-[10px] -mt-1" th:text="#{common.home.suitable}"></span></div>
                    </div>
                    <div class="mt-2"><span th:replace="~{layout :: suitChips(${c.top3()})}"></span></div>
                </div>
                <p class="mt-1 text-xs text-gray-500 text-center md:text-right" th:text="#{common.home.sampleImage}"></p>
                </div></th:block>
            </div>
        </div>
    </section>

    <!-- 2. Stats strip (real DB counts) -->
    <section class="pt-12 md:pt-14"><div class="max-w-7xl mx-auto px-4">
        <div class="card grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 divide-y sm:divide-y-0 divide-gray-100">
            <div class="p-5 text-center"><div class="text-2xl md:text-3xl font-bold text-[#2E6B3A]" th:text="${h.openPlots}"></div><div class="text-sm text-gray-600" th:text="#{common.home.stat.openPlots}"></div></div>
            <div class="p-5 text-center"><div class="text-2xl md:text-3xl font-bold text-[#2E6B3A]" th:text="${@fmt.num(h.totalHa)}"></div><div class="text-sm text-gray-600" th:text="#{common.home.stat.totalHa}"></div></div>
            <div class="p-5 text-center"><div class="text-2xl md:text-3xl font-bold text-[#2E6B3A]" th:text="${h.activeCompetitions}"></div><div class="text-sm text-gray-600" th:text="#{common.home.stat.competitions}"></div></div>
            <div class="p-5 text-center"><div class="text-2xl md:text-3xl font-bold text-[#2E6B3A]" th:text="${h.activeAuctions}"></div><div class="text-sm text-gray-600" th:text="#{common.home.stat.auctions}"></div></div>
            <div class="p-5 text-center"><div class="text-2xl md:text-3xl font-bold text-[#2E6B3A]" th:text="${h.districts}"></div><div class="text-sm text-gray-600" th:text="#{common.home.stat.districts}"></div></div>
            <div class="p-5 text-center"><div class="text-2xl md:text-3xl font-bold text-[#2E6B3A]" th:text="${h.approvedProjects}"></div><div class="text-sm text-gray-600" th:text="#{common.home.stat.approved}"></div></div>
        </div>
    </div></section>

    <!-- 3. How it works -->
    <section class="py-12 md:py-16"><div class="max-w-7xl mx-auto px-4">
        <h2 class="text-2xl font-bold" th:text="#{common.home.how}"></h2>
        <ol class="mt-6 grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <li class="card p-5"><div class="home-icon">🔎</div><div class="mt-3 font-semibold" th:text="#{common.home.how1}"></div><p class="text-sm text-gray-600 mt-1" th:text="#{common.home.how1Text}"></p></li>
            <li class="card p-5"><div class="home-icon">📊</div><div class="mt-3 font-semibold" th:text="#{common.home.how2}"></div><p class="text-sm text-gray-600 mt-1" th:text="#{common.home.how2Text}"></p></li>
            <li class="card p-5"><div class="home-icon">📝</div><div class="mt-3 font-semibold" th:text="#{common.home.how3}"></div><p class="text-sm text-gray-600 mt-1" th:text="#{common.home.how3Text}"></p></li>
            <li class="card p-5"><div class="home-icon">🌱</div><div class="mt-3 font-semibold" th:text="#{common.home.how4}"></div><p class="text-sm text-gray-600 mt-1" th:text="#{common.home.how4Text}"></p></li>
        </ol>
    </div></section>

    <!-- 4. Feature showcase (white band) -->
    <section class="home-band py-12 md:py-16 bg-white border-y border-[#DDE3DC]"><div class="max-w-7xl mx-auto px-4">
        <h2 class="text-2xl font-bold" th:text="#{common.home.features}"></h2>
        <div class="mt-6 grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <a th:href="@{/uygunluq}" class="card p-5 hover:ring-2 hover:ring-leaf-500 transition"><div class="home-icon">🎯</div>
                <div class="mt-3 font-semibold" th:text="#{common.home.feat1}"></div><p class="text-sm text-gray-600 mt-1" th:text="#{common.home.feat1Text}"></p></a>
            <a th:href="@{/saheler/{id}(id=${h.sample == null ? 1 : h.sample.plot.id})} + '#ai'" class="card p-5 hover:ring-2 hover:ring-leaf-500 transition"><div class="home-icon">🛰️</div>
                <div class="mt-3 font-semibold" th:text="#{common.home.feat2}"></div><p class="text-sm text-gray-600 mt-1" th:text="#{common.home.feat2Text}"></p></a>
            <a th:href="@{/xerite}" class="card p-5 hover:ring-2 hover:ring-leaf-500 transition"><div class="home-icon">⛰️</div>
                <div class="mt-3 font-semibold" th:text="#{common.home.feat3}"></div><p class="text-sm text-gray-600 mt-1" th:text="#{common.home.feat3Text}"></p></a>
            <a th:href="@{/kabinet}" class="card p-5 hover:ring-2 hover:ring-leaf-500 transition"><div class="home-icon">📅</div>
                <div class="mt-3 font-semibold" th:text="#{common.home.feat4}"></div><p class="text-sm text-gray-600 mt-1" th:text="#{common.home.feat4Text}"></p></a>
        </div>
    </div></section>

    <!-- 5. Data sources & technologies -->
    <section class="py-12 md:py-16"><div class="max-w-7xl mx-auto px-4">
        <h2 class="text-2xl font-bold" th:text="#{common.home.sources}"></h2>
        <div class="mt-6 flex flex-wrap gap-2">
            <span class="tech-badge" th:text="#{common.home.src.esri}"></span>
            <span class="tech-badge" th:text="#{common.home.src.meteo}"></span>
            <span class="tech-badge" th:text="#{common.home.src.terrain}"></span>
            <span class="tech-badge" th:text="#{common.home.src.claude}"></span>
            <span class="tech-badge" th:text="#{common.home.src.ektis}"></span>
        </div>
    </div></section>

    <!-- 6. Potential partners (NOT official, white band) -->
    <section class="home-band py-12 md:py-16 bg-white border-y border-[#DDE3DC]"><div class="max-w-7xl mx-auto px-4">
        <h2 class="text-2xl font-bold" th:text="#{common.home.partners}"></h2>
        <p class="mt-2 inline-block text-sm font-medium text-amber-800 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2" th:text="#{common.home.partnersNote}"></p>
        <div class="mt-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
            <div class="card p-4"><div class="font-semibold" th:text="#{common.home.p.ministry}"></div><div class="text-sm text-gray-600" th:text="#{common.home.p.ministryText}"></div></div>
            <div class="card p-4"><div class="font-semibold" th:text="#{common.home.p.anama}"></div><div class="text-sm text-gray-600" th:text="#{common.home.p.anamaText}"></div></div>
            <div class="card p-4"><div class="font-semibold" th:text="#{common.home.p.fund}"></div><div class="text-sm text-gray-600" th:text="#{common.home.p.fundText}"></div></div>
            <div class="card p-4"><div class="font-semibold" th:text="#{common.home.p.insurance}"></div><div class="text-sm text-gray-600" th:text="#{common.home.p.insuranceText}"></div></div>
            <div class="card p-4"><div class="font-semibold" th:text="#{common.home.p.banks}"></div><div class="text-sm text-gray-600" th:text="#{common.home.p.banksText}"></div></div>
            <div class="card p-4"><div class="font-semibold" th:text="#{common.home.p.unis}"></div><div class="text-sm text-gray-600" th:text="#{common.home.p.unisText}"></div></div>
        </div>
    </div></section>

    <!-- 7. FAQ -->
    <section class="py-12 md:py-16"><div class="max-w-3xl mx-auto px-4">
        <h2 class="text-2xl font-bold" th:text="#{common.home.faq}"></h2>
        <div class="mt-6 space-y-3">
            <details class="faq card"><summary th:text="#{common.home.faq1}"></summary>
                <p th:text="#{common.home.faq1Text}"></p></details>
            <details class="faq card"><summary th:text="#{common.home.faq2}"></summary>
                <p th:text="#{common.home.faq2Text}"></p></details>
            <details class="faq card"><summary th:text="#{common.home.faq3}"></summary>
                <p th:text="#{common.home.faq3Text}"></p></details>
            <details class="faq card"><summary th:text="#{common.home.faq4}"></summary>
                <p th:text="#{common.home.faq4Text}"></p></details>
            <details class="faq card"><summary th:text="#{common.home.faq5}"></summary>
                <p th:text="#{common.home.faq5Text}"></p></details>
        </div>
    </div></section>

    <!-- 8. Final CTA -->
    <section class="pb-4"><div class="max-w-7xl mx-auto px-4">
        <div class="rounded-2xl bg-[#2E6B3A] text-white p-8 md:p-12 flex flex-col md:flex-row md:items-center gap-6">
            <div class="flex-1">
                <h2 class="text-2xl md:text-3xl font-bold" th:text="#{common.home.cta}"></h2>
                <p class="mt-2 text-white/85" th:text="#{common.home.ctaText}"></p>
            </div>
            <div class="flex flex-col sm:flex-row gap-3">
                <a th:href="@{/uygunluq}" class="btn-secondary !border-white" th:text="#{common.home.ctaStart}"></a>
                <a th:href="@{/qeydiyyat}" class="btn-primary !bg-[#1E4A28] hover:!bg-black/30" th:text="#{common.nav.register}"></a>
            </div>
        </div>
    </div></section>
</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
