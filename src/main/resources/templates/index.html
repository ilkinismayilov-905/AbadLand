<!DOCTYPE html>
<html lang="az" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Ana səhifə')}"></head>
<body class="bg-gray-50 text-gray-900">
<header th:replace="~{layout :: header}"></header>
<div th:replace="~{layout :: flash}"></div>
<main>
    <section class="bg-gradient-to-br from-leaf-600 to-earth-500 text-white">
        <div class="max-w-7xl mx-auto px-4 py-16">
            <h1 class="text-4xl font-bold max-w-3xl">Qarabağ və Şərqi Zəngəzurda kənd təsərrüfatına investisiya</h1>
            <p class="mt-4 max-w-2xl text-lg text-white/90">Torpaq sahələrini xəritədə tapın, meyvə uyğunluğunu, gəlirliliyi və riskləri qiymətləndirin, müsabiqəyə onlayn müraciət edin.</p>
            <a th:href="@{/uygunluq}" class="inline-block mt-8 px-6 py-3 rounded-lg bg-white text-leaf-700 font-semibold shadow hover:bg-leaf-50">Sizə uyğun torpağı tapın →</a>
        </div>
    </section>
    <section class="max-w-7xl mx-auto px-4 -mt-8 grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="bg-white rounded-lg shadow p-5"><div class="text-3xl font-bold text-leaf-700" th:text="${plotCount}">0</div><div class="text-sm text-gray-600">Torpaq sahəsi</div></div>
        <div class="bg-white rounded-lg shadow p-5"><div class="text-3xl font-bold text-leaf-700" th:text="${#numbers.formatInteger(totalHa, 1, 'WHITESPACE')} + ' ha'">0</div><div class="text-sm text-gray-600">Ümumi sahə</div></div>
        <div class="bg-white rounded-lg shadow p-5"><div class="text-3xl font-bold text-leaf-700" th:text="${openCompetitions}">0</div><div class="text-sm text-gray-600">Açıq müsabiqə</div></div>
        <div class="bg-white rounded-lg shadow p-5"><div class="text-3xl font-bold text-leaf-700" th:text="${#numbers.formatInteger(approvedInvestment, 1, 'WHITESPACE')} + ' AZN'">0</div><div class="text-sm text-gray-600">Təsdiqlənmiş investisiya</div></div>
    </section>
</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
