<!DOCTYPE html>
<html lang="az" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <title th:text="${title} + ' · AqroInvest Qarabağ'">AqroInvest Qarabağ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: {
            leaf: {50:'#f1f8ee',100:'#dcefd3',500:'#4d8b31',600:'#3d7326',700:'#2f5a1e',800:'#23431a'},
            earth: {50:'#faf6f0',100:'#f1e7d6',500:'#a0703c',700:'#6e4a25'} } } } };
    </script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<header th:fragment="header" class="bg-leaf-700 text-white">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center gap-4">
        <a th:href="@{/}" class="text-xl font-bold tracking-tight">🌱 AqroInvest Qarabağ</a>
        <nav class="flex flex-wrap gap-4 text-sm">
            <a th:href="@{/xerite}" class="hover:underline">Xəritə</a>
            <a th:href="@{/saheler}" class="hover:underline">Sahələr</a>
            <a th:href="@{/musabiqeler}" class="hover:underline">Müsabiqələr</a>
            <a th:href="@{/uygunluq}" class="hover:underline">Uyğunluq testi</a>
            <a th:href="@{/herraclar}" class="hover:underline">Hərraclar</a>
            <!-- "Pay layihələri" (/pay-layiheleri) comes back with Step 8 -->
            <a sec:authorize="hasRole('INVESTOR')" th:href="@{/kabinet}" class="hover:underline font-semibold">Kabinet</a>
            <a sec:authorize="hasAnyRole('OPERATOR','COMMISSION','ADMIN')" th:href="@{/idare}" class="hover:underline font-semibold">İdarəetmə</a>
        </nav>
        <div class="ml-auto flex items-center gap-3 text-sm">
            <th:block sec:authorize="isAnonymous()">
                <a th:href="@{/giris}" class="px-3 py-1 rounded bg-white text-leaf-700 font-medium">Daxil ol</a>
                <a th:href="@{/qeydiyyat}" class="hover:underline">Qeydiyyat</a>
            </th:block>
            <th:block sec:authorize="isAuthenticated()">
                <a th:href="@{/bildirisler}" class="relative" title="Bildirişlər">🔔
                    <span th:if="${unreadCount > 0}" th:text="${unreadCount}"
                          class="absolute -top-2 -right-3 bg-red-600 text-white text-xs rounded-full px-1.5"></span>
                </a>
                <span>
                    <span sec:authentication="name"></span>
                    <span class="text-leaf-100" th:text="'(' + ${@statusLabels.roleLabel(#authentication.authorities[0].authority)} + ')'"></span>
                </span>
                <form th:action="@{/cixis}" method="post">
                    <button class="px-3 py-1 rounded border border-white/60 hover:bg-white/10">Çıxış</button>
                </form>
            </th:block>
        </div>
    </div>
</header>

<div th:fragment="flash" class="max-w-7xl mx-auto px-4 mt-4">
    <div th:if="${success}" th:text="${success}" class="p-3 rounded bg-green-100 text-green-800 border border-green-200"></div>
    <div th:if="${error}" th:text="${error}" class="p-3 rounded bg-red-100 text-red-800 border border-red-200"></div>
</div>

<!-- Catalog/map filter; action = page URL -->
<form th:fragment="plotFilter(action)" th:action="@{${action}}" method="get"
      class="bg-white rounded-lg shadow p-4 grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-3 text-sm items-end">
    <label class="col-span-2 block"><span class="font-semibold text-leaf-700">Hansı meyvə üçün?</span>
        <select name="fruit" class="mt-1 w-full border rounded px-2 py-1.5 border-leaf-500">
            <option value="">— hamısı —</option>
            <option th:each="f : ${fruits}" th:value="${f.code}" th:text="${f.nameAz}" th:selected="${f.code == filter.fruit}"></option>
        </select></label>
    <label class="block"><span>Region</span>
        <select name="region" class="mt-1 w-full border rounded px-2 py-1.5">
            <option value="">Hamısı</option>
            <option th:each="r : ${regions}" th:value="${r}" th:text="${@statusLabels.label(r)}" th:selected="${r == filter.region}"></option>
        </select></label>
    <label class="block"><span>Rayon</span>
        <select name="district" class="mt-1 w-full border rounded px-2 py-1.5">
            <option value="">Hamısı</option>
            <option th:each="d : ${districts}" th:value="${d}" th:text="${d}" th:selected="${d == filter.district}"></option>
        </select></label>
    <label class="block"><span>Fəaliyyət</span>
        <select name="activity" class="mt-1 w-full border rounded px-2 py-1.5">
            <option value="">Hamısı</option>
            <option th:each="a : ${activities}" th:value="${a}" th:text="${@statusLabels.label(a)}" th:selected="${a == filter.activity}"></option>
        </select></label>
    <label class="block"><span>Mina vəziyyəti</span>
        <select name="demining" class="mt-1 w-full border rounded px-2 py-1.5">
            <option value="">Hamısı</option>
            <option th:each="d : ${deminings}" th:value="${d}" th:text="${@statusLabels.label(d)}" th:selected="${d == filter.demining}"></option>
        </select></label>
    <label class="block"><span>Min ha</span>
        <input name="minHa" type="number" min="0" step="any" th:value="${filter.minHa}" class="mt-1 w-full border rounded px-2 py-1.5"></label>
    <label class="block"><span>Maks ha</span>
        <input name="maxHa" type="number" min="0" step="any" th:value="${filter.maxHa}" class="mt-1 w-full border rounded px-2 py-1.5"></label>
    <div class="col-span-2 md:col-span-4 lg:col-span-8 flex gap-3">
        <button class="px-4 py-1.5 rounded bg-leaf-600 text-white font-medium hover:bg-leaf-700">Filtrlə</button>
        <a th:href="@{${action}}" class="px-4 py-1.5 rounded border">Sıfırla</a>
    </div>
</form>

<!-- 3D viewer scripts (passport, map only). Order matters: three.js before plot3d.js -->
<th:block th:fragment="scripts3d">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script th:src="@{/js/plot3d.js}"></script>
</th:block>

<!-- Suitability chips: "Nar 85% · Qayda" -->
<span th:fragment="suitChips(list)" class="flex flex-wrap gap-1">
    <span th:each="s : ${list}" th:title="${s.reason}"
          th:class="'inline-block px-2 py-0.5 rounded text-xs font-medium ' + (${s.score >= 75} ? 'bg-green-100 text-green-800' : (${s.score >= 60} ? 'bg-yellow-100 text-yellow-800' : 'bg-gray-100 text-gray-600'))">
        <span th:text="${s.crop.nameAz} + ' ' + ${s.score} + '%'"></span>
        <span class="opacity-60" th:text="'· ' + ${@statusLabels.label(s.source)}"></span>
    </span>
</span>

<footer th:fragment="footer" class="mt-16 border-t bg-earth-50 text-sm text-earth-700">
    <div class="max-w-7xl mx-auto px-4 py-6">
        AqroInvest Qarabağ — hakaton MVP. Bütün məlumatlar uydurmadır (sınaq dəyəri).
    </div>
    <!-- Dev only: auto-refresh after code changes (Spring DevTools LiveReload, spring-boot:run) -->
    <script th:if="${liveReload}">
        const lr = document.createElement('script');
        lr.src = '//' + location.hostname + ':35729/livereload.js';
        document.head.appendChild(lr);
    </script>
</footer>
</body>
</html>
