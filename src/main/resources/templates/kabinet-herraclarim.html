<!DOCTYPE html>
<html lang="az" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Hərraclarım')}"></head>
<body class="bg-gray-50 text-gray-900">
<header th:replace="~{layout :: header}"></header>
<main class="max-w-5xl mx-auto px-4 py-6 space-y-4">
    <div class="flex items-center"><h1 class="text-2xl font-bold">Hərraclarım</h1>
        <a th:href="@{/kabinet}" class="ml-auto text-sm text-leaf-700 underline">← Kabinet</a></div>
    <p th:if="${rows.isEmpty()}" class="bg-white rounded-lg shadow p-6 text-gray-600">Hələ hərracda iştirak etməmisiniz.
        <a th:href="@{/herraclar}" class="text-leaf-700 underline">Hərraclara baxın</a>.</p>
    <div th:unless="${rows.isEmpty()}" class="bg-white rounded-lg shadow overflow-x-auto">
        <table class="w-full text-sm min-w-[600px]">
            <tr class="text-left text-gray-500 bg-earth-50"><th class="p-3">Hərrac</th><th>Sahə</th><th>Status</th><th>Mən</th><th class="text-right">Son təklifim</th><th class="pl-4">Nəticə</th></tr>
            <tr th:each="r : ${rows}" class="border-t">
                <td class="p-3"><a th:href="@{/herraclar/{id}(id=${r.a.id})}" class="text-leaf-700 underline" th:text="${r.a.code}"></a></td>
                <td th:text="${r.a.plot.code}"></td>
                <td><span th:class="${@statusLabels.badge(r.a.status)}" th:text="${@statusLabels.label(r.a.status)}"></span></td>
                <td th:text="'#' + ${r.p.number} + (${r.p.depositConfirmed} ? '' : ' · zaminat yox')"></td>
                <td class="text-right" th:text="${r.last >= 0} ? ${@fmt.money(r.last)} : '—'"></td>
                <td class="pl-4" th:text="${r.won} ? 'Qalib ✓' : (${r.highest} ? 'Ən yüksək təklif' : '—')"></td>
            </tr>
        </table>
    </div>
</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
