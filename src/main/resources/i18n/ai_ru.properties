# AI center (/ai) — public page about the existing land analysis. Keep claims to what is implemented.
ai.title=ИИ-центр
ai.badge=Рекомендация ИИ · не решение
ai.heading=ИИ-помощник, который читает участок по спутниковому снимку
ai.lead=Он объединяет спутниковый снимок, климатические данные и требования культур и готовит для каждого участка первичную оценку пригодности, рисков и полива.
ai.choose=Выбрать участок
ai.seeExample=Посмотреть пример
ai.statusOn=ИИ-сервис активен.
ai.statusOff=ИИ-сервис сейчас отключён — пример и готовые результаты по-прежнему видны.
ai.uses=Что анализирует ИИ и что даёт
ai.cap1=Спутниковый снимок
ai.cap1Text=Цветной (RGB) снимок участка из Esri World Imagery, граница — жёлтой линией. Дата съёмки неизвестна.
ai.cap2=Климат и рельеф
ai.cap2Text=Open-Meteo: высота, средняя и минимальная температура, дни с заморозками, осадки. Если не обновлено — тестовое значение.
ai.cap3=Пригодность культур
ai.cap3Text=Балл 0–100 и краткая причина для каждой культуры; нерекомендуемые культуры — отдельно.
ai.cap4=Риски, полив, проверки
ai.cap4Text=Уровни риска, рекомендация по поливу, что проверить на месте и чего не хватает в данных.
ai.notTitle=Чего он не делает:
ai.notText=Нет NDVI и мониторинга растительности, нет отслеживания изменений, анализа химии почвы и оценки мин; нет гарантии дохода.
ai.pickHeading=Выберите участок
ai.pickLabel=Участок
ai.pickPlaceholder=— Выберите участок —
ai.pickSubmit=Показать
ai.pickMap=Выбрать на спутниковой карте
ai.withAnalysis=Участки с ИИ-анализом:
ai.noneAnalysed=Реального ИИ-анализа пока нет ни для одного участка.
ai.notFound=Участок не найден. Выберите из списка.
ai.imageCaption=Снимок, который видит ИИ, — граница участка жёлтой линией. Дата съёмки неизвестна.
ai.facts.purpose=Назначение
ai.facts.water=Источник воды
ai.facts.irrigation=Полив
ai.yes=есть
ai.no=нет
ai.state.RUNNING=Анализ этого участка выполняется. Загляните в паспорт через несколько минут.
ai.state.AVAILABLE=ИИ-анализ этого участка готов — результат ниже.
ai.state.FAILED=Последняя попытка анализа не удалась. Можно повторить в паспорте.
ai.state.SAMPLE=Для этого участка есть только образец анализа — реального анализа ещё нет.
ai.state.NONE=Этот участок ещё не анализировался ИИ.
ai.viewResult=Результат в паспорте
ai.runOnPassport=Анализ ИИ в паспорте
ai.openPassport=Паспорт участка
ai.loginToRun=Войдите для анализа
ai.noKeyNote=Ключ ИИ не настроен — новый анализ сейчас невозможен.
ai.limitNote=Анализ запускает вошедший пользователь (5 в день). Просмотр готового результата не учитывается.
ai.realResult=Реальный ИИ-анализ
ai.exampleHeading=Пример результата
ai.exampleBadge=Образец анализа — демо-данные, не реальный вызов ИИ
ai.exampleIntro=Так выглядит результат. Участок:
ai.exampleNone=Образец анализа недоступен.
ai.explainHeading=Как читать результаты
ai.ex1=Балл пригодности культуры
ai.ex1Text=0–100: оценка ИИ по спутниковому снимку, климату и требованиям культуры. Это балл с источником «ИИ» в каталоге; балл «Правило» считается по правилам заморозков, высоты и воды.
ai.ex2=Уровни риска
ai.ex2Text=Низкий / Средний / Высокий — то, что требует внимания (заморозки, вода, склон и т. п.). Разминирование показывается только по официальным данным; ИИ его не оценивает.
ai.ex3=Рекомендация по поливу
ai.ex3Text=Общее направление по источнику воды, осадкам и потребности культуры (например, капельный полив). Не проектный расчёт.
ai.ex4=Достоверность
ai.ex4Text=Высокая / Средняя / Низкая — собственная оценка ИИ; ниже, когда данных мало.
ai.ex5=Ограничения
ai.ex5Text=Дата снимка неизвестна и может быть давней; климатические значения тестовые, если не обновлены. Перед решением нужны анализ почвы и мнение агронома.
ai.nextHeading=Следующий шаг
ai.nextAnon=Для просмотра результатов вход не нужен. Чтобы запустить новый анализ, войдите или зарегистрируйтесь.
ai.nextUser=Выберите участок и нажмите «Анализировать с ИИ» в его паспорте.
