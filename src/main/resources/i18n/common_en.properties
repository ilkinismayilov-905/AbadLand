common.home.faq=Frequently asked questions
common.home.faq1=Who can apply?
common.home.faq1Text=Registered investors (individuals and legal entities) can apply online for a plot in an open competition.
common.home.faq2=Is the land safe — has it been cleared of mines?
common.home.faq2Text=Each plot’s passport shows its demining status: complete, partial or in progress. Partially cleared plots require an additional check.
common.home.faq3=How are applications evaluated?
common.home.faq3Text=An operator reviews the application and the commission makes the decision. The decision and its reason appear in your account and are sent to EKTİS.
common.home.faq4=Does AI make the decision?
common.home.faq4Text=No. AI only gives a recommendation (land analysis based on satellite and climate data). The decision is always made by the commission.
common.home.faq5=What happens after approval?
common.home.faq5Text=A farm is created in your account: crop plan, planting calendar, workforce and quarterly reports. An operator carries out monitoring.
common.home.cta=Find the right plot in 2 minutes
common.home.ctaText=Answer 5 questions — plots in open competitions are ranked by suitability score.
