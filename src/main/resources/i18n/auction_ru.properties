# Auctions (ru)
auction.common.areaHa={0} га
auction.common.years={0} лет
auction.common.participantNo=Участник №{0}
auction.legalNote=Аукцион — симуляция: задаток и оплата реально не проводятся. Продажа и аренда государственных земель должны осуществляться в соответствии с законодательством и правилами уполномоченного органа; в реальном применении предусмотрена интеграция с действующей государственной аукционной платформой.
auction.rules.lease=Ставка — годовая арендная плата за весь участок (AZN/год). Каждая ставка должна быть выше текущей цены минимум на один шаг. Ставка, сделанная в последние 2 минуты, продлевает время окончания на 2 минуты. Для участия в торгах нужны регистрация и задаток. Победитель — участник с наибольшей ставкой на момент окончания; результат утверждает комиссия.
auction.rules.sale=Ставка — общая цена продажи участка (AZN). Каждая ставка должна быть выше текущей цены минимум на один шаг. Ставка, сделанная в последние 2 минуты, продлевает время окончания на 2 минуты. Для участия в торгах нужны регистрация и задаток. Победитель — участник с наибольшей ставкой на момент окончания; результат утверждает комиссия.

