ai.ex1=Bitki uyğunluğu balı
ai.ex1Text=0–100 arası: AI-nin peyk görüntüsü, iqlim və bitki tələblərinə əsasən verdiyi qiymət. Kataloqda "AI" mənbəli bal budur; "Qayda" mənbəli bal isə şaxta, hündürlük və su qaydaları ilə hesablanır.
ai.ex2=Risk səviyyələri
ai.ex2Text=Aşağı / Orta / Yüksək — diqqət tələb edən məqamlar (şaxta, su, yamac və s.). Minalardan təmizlənmə yalnız rəsmi məlumatla göstərilir; AI bunu qiymətləndirmir.
ai.ex3=Suvarma tövsiyəsi
ai.ex3Text=Su mənbəyi, yağıntı və bitki tələbinə görə ümumi istiqamət (məs. damcı suvarma). Layihə hesablaması deyil.
ai.ex4=Etibarlılıq
ai.ex4Text=Yüksək / Orta / Aşağı — AI-nin öz qiymətləndirməsi; məlumat az olanda aşağı olur.
ai.ex5=Məhdudiyyətlər
ai.ex5Text=Görüntünün tarixi məlum deyil və köhnə ola bilər; iqlim dəyərləri yenilənməyibsə sınaq dəyəridir. Qərardan əvvəl torpaq analizi və aqronom rəyi lazımdır.
