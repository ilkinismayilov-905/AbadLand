common.home.faq=Частые вопросы
common.home.faq1=Кто может подать заявку?
common.home.faq1Text=Зарегистрированные инвесторы — физические и юридические лица — могут онлайн подать заявку на участок в открытом конкурсе.
common.home.faq2=Безопасна ли земля, разминирована ли она?
common.home.faq2Text=В паспорте каждого участка указан статус разминирования: полностью, частично или в процессе. Частично очищенные участки требуют дополнительной проверки.
common.home.faq3=Как оцениваются заявки?
common.home.faq3Text=Оператор проверяет заявку, решение принимает комиссия. Решение и его причина видны в вашем кабинете и передаются в EKTİS.
common.home.faq4=Принимает ли решение ИИ?
common.home.faq4Text=Нет. ИИ только даёт рекомендацию (анализ земли по спутниковым и климатическим данным). Решение всегда принимает комиссия.
common.home.faq5=Что происходит после одобрения?
common.home.faq5Text=В вашем кабинете создаётся хозяйство: план посадок, календарь посадок, работники и квартальные отчёты. Оператор ведёт мониторинг.
common.home.cta=Найдите подходящий участок за 2 минуты
common.home.ctaText=Ответьте на 5 вопросов — участки открытых конкурсов будут отсортированы по баллу соответствия.
common.home.ctaStart=Начать тест

