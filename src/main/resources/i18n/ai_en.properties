# AI center (/ai) — public page about the existing land analysis. Keep claims to what is implemented.
ai.title=AI center
ai.badge=AI recommendation · not a decision
ai.heading=An AI assistant that reads land from satellite imagery
ai.lead=It combines satellite imagery, climate data and crop requirements into a first suitability, risk and irrigation recommendation for each plot.
