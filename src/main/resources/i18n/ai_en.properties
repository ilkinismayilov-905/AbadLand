ai.explainHeading=How to read the results
ai.ex1=Crop suitability score
ai.ex1Text=0–100: the AI's rating from the satellite image, climate and crop requirements. This is the "AI" score in the catalog; the "Rule" score is calculated from frost, elevation and water rules.
ai.ex2=Risk levels
ai.ex2Text=Low / Medium / High — points that need attention (frost, water, slope, etc.). Demining is shown only from official data; the AI does not assess it.
ai.ex3=Irrigation advice
ai.ex3Text=A general direction based on the water source, rainfall and crop needs (e.g. drip irrigation). Not an engineering design.
ai.ex4=Confidence
ai.ex4Text=High / Medium / Low — the AI's own rating; lower when data is scarce.
ai.ex5=Limitations
ai.ex5Text=The image date is unknown and may be old; climate values are test values unless refreshed. A soil analysis and an agronomist's opinion are needed before any decision.
ai.nextHeading=Next step
ai.nextAnon=No login is needed to view results. Log in or sign up to start a new analysis.
