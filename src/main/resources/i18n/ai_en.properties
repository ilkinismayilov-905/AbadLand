ai.uses=What the AI looks at and what it gives
ai.cap1=Satellite image
ai.cap1Text=Colour (RGB) image of the plot from Esri World Imagery, boundary in yellow. The capture date is unknown.
ai.cap2=Climate and terrain
ai.cap2Text=Open-Meteo: elevation, mean and minimum temperature, frost days, precipitation. If not refreshed — test value.
ai.cap3=Crop suitability
ai.cap3Text=A 0–100 score with a short reason for each crop; crops not recommended listed separately.
ai.cap4=Risks, irrigation, checks
ai.cap4Text=Risk levels, irrigation advice, points to check on site and data gaps.
ai.notTitle=What it does not do:
ai.notText=No NDVI or vegetation monitoring, no change tracking, no soil chemistry and no mine assessment; no return guarantee.
