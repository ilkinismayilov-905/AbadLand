# Active only via ./mvnw spring-boot:run (see pom). Templates/static are read from src -> no rebuild needed.
spring.thymeleaf.prefix=file:src/main/resources/templates/
# Templates re-read on every request in dev (production keeps Boot's default: cached)
spring.thymeleaf.cache=false
spring.web.resources.static-locations=file:src/main/resources/static/
# Watch src resources: template/static edits only trigger a browser reload, Java edits (target/classes) restart the app.
spring.devtools.restart.additional-paths=src/main/resources
# mvn compile deletes then re-adds all classes; wait for it to finish -> one restart instead of two
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s
# Demo only: when someone outbids on HRC-2026-01, participant #1 answers once after ~8 s (audit AUCTION_BID_DEMO_BOT)
app.auction.demo-bot=true
