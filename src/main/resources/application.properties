spring.application.name=aqroinvest
server.port=${PORT:8080}

# H2 in-memory: fresh seed on every start = demo reset
spring.datasource.url=jdbc:h2:mem:aqroinvest;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER,VALUE,YEAR,PERIOD,AT,LOCAL
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.thymeleaf.cache=false
spring.jackson.time-zone=Asia/Baku

app.upload-dir=uploads
app.external-api-key=${APP_EXTERNALAPIKEY:change-me}

ai.model=${AI_MODEL:claude-haiku-5-5}
# Key only from the environment (never in files): ANTHROPIC_API_KEY
ai.max-per-user-per-day=5
# false = no outbound calls to Esri / Open-Meteo (tests, offline demo)
app.external.enabled=true
ektis.mode=${EKTIS_MODE:MOCK}
ektis.mock.fail=${EKTIS_MOCK_FAIL:false}

springdoc.swagger-ui.path=/swagger-ui.html
